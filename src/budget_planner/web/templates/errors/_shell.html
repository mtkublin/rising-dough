{% extends "base.html" %}

{% block main %}

    <h1 id="err-heading" class="text-2xl mb-4">{{ heading }}</h1>

      {% block body %}{% endblock %}

      <a class="link-muted" href="/today">Back to dashboard</a>
    </p>
  </section>
{% endblock %}
