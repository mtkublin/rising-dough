{# fragment: ledger/export-menu
   Inputs: export (ledger_export.ExportLinks, the live filters in both hrefs), view. #}
<div class="rd-ledger-head__export">
  <button type="button"
          class="rd-btn"
          aria-haspopup="menu"
          popovertarget="export-menu"
          data-js="row-menu">export <span aria-hidden="true">▾</span></button>
  <div class="rd-menu"
       id="export-menu"
       popover
       role="menu"
       aria-label="Export">
    <span class="rd-menu__grabber" aria-hidden="true"></span>
    <div class="rd-menu__head" role="none">
      <p class="rd-menu__title">Export</p>
      <p class="rd-menu__sub">{{ view }} · current filters</p>
    </div>
    <a class="rd-menu__item" role="menuitem" href="{{ export.csv }}">export as csv</a>
    <a class="rd-menu__item" role="menuitem" href="{{ export.parquet }}">export as parquet</a>
    <button type="button"
            class="rd-menu__item rd-menu__cancel"
            role="menuitem"
            popovertarget="export-menu"
            popovertargetaction="hide">cancel</button>
  </div>
</div>
