{# fragment: flash/error
   Rendered into #flash-region when a save fails. Inputs: message (text), retry_url (optional, POST). #}
<div class="rd-flash rd-flash--error" role="alert"><span>▲ {{ message }}</span>{% if retry_url | default("") %}<button type="button"
        class="rd-flash__action"
        hx-post="{{ retry_url }}"
        hx-disabled-elt="this">retry</button>{% endif %}<button type="button"
        class="rd-btn rd-btn--icon rd-flash__close"
        aria-label="Dismiss"
        data-js="flash-close"><svg class="rd-icon" aria-hidden="true" focusable="false"><use href="/static/rd/icons/sprite.svg#icon-close"></use></svg></button></div>
