{# fragment: charts/forecast
   Inputs: chart (charts.ForecastChart: every coordinate is a precomputed string). Plot area
   x 64–1158, y 16–262; one point per month; the tooltip flips below the point when it would clip
   the top. #}
<figure class="rd-chart-card" aria-labelledby="fc-chart-title">
  <figcaption class="rd-caption" id="fc-chart-title">{{ chart.caption }}</figcaption>
  <div class="rd-chart-card__plot"
       tabindex="0"
       role="region"
       aria-label="Chart (scrolls sideways)">
    <svg class="rd-chart rd-chart--forecast"
         role="img"
         viewBox="{{ chart.view_box }}"
         aria-label="{{ chart.aria_label }}">
      {% for line in chart.grid %}
        <line class="rd-chart__grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ line.y }}" y2="{{ line.y }}" />
        <text class="rd-chart__tick" x="56" y="{{ line.label_y }}" text-anchor="end">{{ line.label }}</text>
      {% endfor %}
      <line class="rd-chart__axis" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ chart.plot_bottom }}" y2="{{ chart.plot_bottom }}" />
      {% for tick in chart.ticks %}
        <line class="rd-chart__axis" x1="{{ tick.x }}" x2="{{ tick.x }}" y1="{{ chart.plot_bottom }}" y2="268" />
        {% if tick.month %}
          <text class="rd-chart__label" x="{{ tick.x }}" y="286" text-anchor="middle">{{ tick.month }}</text>
          <text class="rd-chart__sublabel" x="{{ tick.x }}" y="302" text-anchor="middle">{{ tick.year }}</text>
        {% endif %}
      {% endfor %}
      {% if chart.dots %}
        <polygon class="rd-chart__area" points="{{ chart.area_points }}" />
        <polyline class="rd-chart__line" points="{{ chart.line_points }}" />
      {% endif %}
      {% for dot in chart.dots %}
        <g class="rd-chart__pt" tabindex="0" aria-label="{{ dot.aria_label }}">
        <line class="rd-chart__guide" x1="{{ dot.x }}" x2="{{ dot.x }}" y1="{{ chart.plot_top }}" y2="{{ chart.plot_bottom }}" />
        <circle class="rd-chart__hit" cx="{{ dot.x }}" cy="{{ dot.y }}" r="18" />
        <circle class="rd-chart__dot" cx="{{ dot.x }}" cy="{{ dot.y }}" r="5" />
        {% with tip=dot.tooltip %}
          {% include "fragments/charts/tooltip.html" %}
        {% endwith %}
        </g>
      {% endfor %}
    </svg>
  </div>
</figure>
