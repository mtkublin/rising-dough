{# fragment: rows/deleted-transaction
   Inputs: row (ledger_view.DeletedRowView). A soft-deleted transaction; same columns as rows/deleted-planned,
   the date is the operation date. #}
<tr class="rd-row rd-row--del-planned" id="{{ row.dom_id }}">
  <td class="rd-del__when rd-muted">
    <span class="u-hide-from-md">deleted </span>{{ row.deleted_at }}
  </td>
  <td class="rd-del__due">
    <span class="u-hide-from-md">on </span>{{ row.due_text }}
  </td>
  <td class="rd-del__desc">{{ row.title }}</td>
  <td class="rd-del__cat">
    <span class="rd-chip"
          {% if row.category_hue %} data-color="{{ row.category_hue }}"{% endif %}>{{ row.category_name }}</span>
  </td>
  <td class="rd-row__amount rd-num">{{ row.amount_text }}</td>
  <td class="rd-row__actions">
    <button type="button"
            class="rd-btn"
            hx-post="{{ row.restore_url }}"
            hx-swap="none">restore</button>
  </td>
</tr>
