{# fragment: rows/year-cell-editor
   Inputs: cell (plan_year_view.YearCell). One month cell of the year grid: a link that opens the
   override dialog in #modal-root (the href is the no-script fallback). data-state is the tier. #}
<td class="rd-year__cell-wrap">
  <a class="rd-year-cell"
     data-state="{{ cell.state }}"
     href="{{ cell.url }}"
     hx-get="{{ cell.url }}"
     hx-target="#modal-root"
     hx-swap="innerHTML"
     aria-label="{{ cell.label }}">{{ cell.text }}</a>
</td>
