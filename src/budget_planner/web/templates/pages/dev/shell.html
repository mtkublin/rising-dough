{# Dev-only placeholder page on the new base (T-UR02): exercises the shell journeys.
   Served at /dev/shell outside production; not a product page. #}
{% extends "layouts/base.html" %}
{% block title %}/dev/shell · Rising Dough{% endblock %}
{% block main %}
  <h1 class="rd-h1">Shell</h1>
  <section class="rd-card rd-card--outline" aria-labelledby="appearance-title">
    <h2 class="rd-card__title" id="appearance-title">Appearance</h2>
    <div class="rd-card__body">
      <div class="rd-setting-line">
        <span class="rd-field__label" id="theme-label">theme</span>
        <div class="rd-segmented"
             role="group"
             aria-labelledby="theme-label"
             data-js="theme-switch">
          <button type="button"
                  class="rd-segmented__option"
                  aria-pressed="true"
                  data-theme-value="system">system</button>
          <button type="button"
                  class="rd-segmented__option"
                  aria-pressed="false"
                  data-theme-value="light">light</button>
          <button type="button"
                  class="rd-segmented__option"
                  aria-pressed="false"
                  data-theme-value="dark">dark</button>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
