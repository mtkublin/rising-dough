<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token"
          content="{{ csrf_token if csrf_token is string else '' }}">
    <meta name="robots" content="noindex">
    <title>{% block title %}Sign in · Rising Dough{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', path='fonts.css') }}?v=rd1">
    <link rel="stylesheet"
          href="{{ url_for('static', path='tokens.css') }}?v=rd1">
    <link rel="stylesheet"
          href="{{ url_for('static', path='tailwind.css') }}?v=t102">
    <link rel="stylesheet"
          href="{{ url_for('static', path='app.css') }}?v=fit1">
    <link rel="stylesheet"
          href="{{ url_for('static', path='rising-dough.css') }}?v=rd1">
    <link rel="stylesheet"
          href="{{ url_for('static', path='auth.css') }}?v=auth1">
  </head>
  <body class="rd">
    <main id="main" class="rd-auth">
      {% block main %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='js/passkeys.js') }}?v=pk3" defer></script>
  </body>
</html>
