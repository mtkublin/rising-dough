# Pre-commit hook stack. Pinned revs; bump via `pre-commit autoupdate` quarterly.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(src/budget_planner/web/static/tailwind\.css|package-lock\.json|tests/e2e/vendor/.*|docs/design/.*|docs/application_redesign_handoff/.*)$
      - id: end-of-file-fixer
        exclude: ^(src/budget_planner/web/static/tailwind\.css|package-lock\.json|tests/e2e/vendor/.*|docs/design/.*|docs/application_redesign_handoff/.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^tests/e2e/vendor/axe\.min\.js$ # vendored axe-core (T-Q300), 540 kB
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(src/budget_planner/web/static/tailwind\.css|tests/e2e/vendor/.*|docs/design/.*|docs/application_redesign_handoff/.*)$

  # ADR-0120 amendment (2026-11-21, T-Q240): Python tool hooks run the versions
  # locked in uv.lock (`uv run <tool>`), so local, CI and `just` agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --quiet ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --quiet ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        # Whole-repo (config: pyproject packages), env = the locked dev group.
        entry: uv run --quiet mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$

      # Scope to migrations only. tests/fixtures/*.sql is auto-generated
      # by scripts/dump_schema.sh and must stay byte-for-byte identical to
      # the SQLite master dump; sqlfluff's cosmetic rewrites would diverge it.
      - id: sqlfluff-lint
        name: sqlfluff-lint
        entry: uv run --quiet sqlfluff lint
        language: system
        files: ^migrations/.*\.sql$

      - id: sqlfluff-fix
        name: sqlfluff-fix
        entry: uv run --quiet sqlfluff fix --force
        language: system
        files: ^migrations/.*\.sql$

      - id: djlint-jinja
        name: djLint (jinja templates)
        entry: uv run --quiet djlint --check
        language: system
        types_or: [html]
        files: ^src/budget_planner/web/templates/.*\.html$
        # Designer handoff is vendored byte-identical (ADR-0106, T-UT01).
        exclude: ^(docs/design|docs/application_redesign_handoff)/

      - id: bandit
        name: bandit
        entry: uv run --quiet bandit --configfile=pyproject.toml --recursive src
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$

      - id: xenon
        name: xenon (cyclomatic complexity ceiling C, ADR-0130 amendment 2026-11-22)
        entry: uv run --quiet xenon --max-absolute C src
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml|uv\.lock)$

      - id: detect-secrets
        name: Detect secrets
        entry: uv run --quiet detect-secrets-hook --baseline .secrets.baseline
        language: system
        # Vendored designer output (ADR-0129): public SRI hashes, not secrets.
        # Vendored axe-core (T-Q300) is minified third-party code, not secrets.
        exclude: ^(docs/application_redesign_handoff/|tests/e2e/vendor/)

      - id: pytest-fast
        name: pytest (affected tests, testmon)
        # The local gate (ADR-0120): testmon-selected tests across the whole
        # suite, xdist workers from PYTEST_WORKERS. Recipe lives in the justfile.
        entry: just test-fast
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-imports
        name: lint-imports (layering contracts, ADR-0130)
        # Only when Python sources or the contracts change; ~1-2 s (measured in
        # docs/plans/quality-audit/baseline/precommit-timing.md).
        entry: uv run --quiet lint-imports
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|pyproject\.toml)$

      - id: stylelint
        name: stylelint (hand-authored CSS)
        entry: npx --no-install stylelint
        language: system
        files: ^src/budget_planner/web/static/[^/]+\.css$
        exclude: ^src/budget_planner/web/static/tailwind\.css$

      - id: tailwind-check
        name: tailwind-check (regenerated CSS matches source)
        entry: scripts/pre-commit/tailwind_check.sh
        language: system
        pass_filenames: false
        files: ^(src/budget_planner/web/templates/.*\.html|src/budget_planner/web/static/js/.*\.js|src/budget_planner/web/static/tailwind\.(src\.)?css|tailwind\.config\.js|package(-lock)?\.json)$
