# Pre-commit hook stack. Pinned revs; bump via `pre-commit autoupdate` quarterly.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(src/budget_planner/web/static/tailwind\.css|package-lock\.json)$
      - id: end-of-file-fixer
        exclude: ^(src/budget_planner/web/static/tailwind\.css|package-lock\.json)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^src/budget_planner/web/static/tailwind\.css$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-python-dateutil>=2.9
          - pandas-stubs>=2.2
          - fastapi>=0.115
          - pytest>=8.3
          - httpx>=0.27
          - jinja2>=3.1
          - markupsafe>=2.1
          - beautifulsoup4>=4.12
          - types-beautifulsoup4>=4.12
          - playwright>=1.47
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        files: ^(src|tests)/

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.1
    hooks:
      # Scope to migrations only. tests/fixtures/*.sql is auto-generated
      # by scripts/dump_schema.sh and must stay byte-for-byte identical to
      # the SQLite master dump — sqlfluff's cosmetic rewrites would make
      # it diverge from what the generator writes.
      - id: sqlfluff-lint
        files: ^migrations/.*\.sql$
      - id: sqlfluff-fix
        files: ^migrations/.*\.sql$

  - repo: https://github.com/djlint/djLint
    rev: v1.35.2
    hooks:
      - id: djlint-jinja
        files: \.html$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [--configfile=pyproject.toml, --recursive, src]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: uv run pytest -q -m "not integration and not e2e and not visual" --no-cov
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: stylelint
        name: stylelint (hand-authored CSS)
        entry: npx --no-install stylelint
        language: system
        files: ^src/budget_planner/web/static/[^/]+\.css$
        exclude: ^src/budget_planner/web/static/tailwind\.css$

      - id: tailwind-check
        name: tailwind-check (regenerated CSS matches source)
        entry: scripts/pre-commit/tailwind_check.sh
        language: system
        pass_filenames: false
        files: ^(src/budget_planner/web/templates/.*\.html|src/budget_planner/web/static/js/.*\.js|src/budget_planner/web/static/tailwind\.(src\.)?css|tailwind\.config\.js|package(-lock)?\.json)$
