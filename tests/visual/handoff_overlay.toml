# --- row 12 / ADR-0151: Reconciliation is system-only, so N = 25 - 1 = 24.
# The search input placeholder carries the same count but `placeholder` is not
# an allowed overlay attribute (ADR-0147 section 4); see the item report.

[[row]]
page = "pages/overlays/*.html"
