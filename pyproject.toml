[project]
name = "budget-planner"
version = "0.1.0"
description = "Local-first personal budget planning and fortune tracking web app."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "Mikolaj Kublin" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "pandas>=2.2",
  "pyarrow>=17",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "structlog>=24.4",
  # T-D02a / ADR-0067: password hashing + WebAuthn ceremonies.
  "bcrypt>=4.2",
  "webauthn>=2.7,<3",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "beautifulsoup4>=4.12",
  "playwright>=1.47",
  "sqlfluff>=3.1",
  "djlint>=1.35",
  "bandit>=1.7",
  "detect-secrets>=1.5",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "types-python-dateutil>=2.9",
  "pandas-stubs>=2.2",
  "httpx2>=0.1",
  "sqlglot>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_planner"]

[tool.uv]
package = true
# ADR-0067: webauthn 3.x needs cbor2>=6 / cryptography>=49, which ship no
# macOS x86_64 wheels (dev machines run an x86_64 interpreter). Cap the
# transitive deps until wheels exist; Linux prod images are unaffected.
constraint-dependencies = ["cbor2<6", "cryptography<49"]

# ---------------------------------------------------------------------------
# ruff — lint + format + import sort
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/*.sql", "docs/**"]

[tool.ruff.lint]
# Enabled rule groups (see https://docs.astral.sh/ruff/rules/).
select = [
  "E", "F", "W",         # pycodestyle + pyflakes
  "I",                   # isort
  "B",                   # bugbear
  "UP",                  # pyupgrade
  "SIM",                 # simplify
  "RET",                 # return
  "PTH",                 # use pathlib
  "N",                   # pep8-naming
  "ANN",                 # type annotations required
  "ASYNC",
  "S",                   # bandit-lite (complements standalone bandit)
  "C4",                  # comprehensions
  "DTZ",                 # datetime timezone
  "TID",                 # tidy imports
  "ARG",                 # unused arg
  "ERA",                 # eradicate commented-out code
  "PL",                  # pylint subset
  "RUF",                 # ruff-specific
]
ignore = [
  "ANN401",              # dynamic Any allowed in explicit kwargs forwarding
  "PLR0913",             # function arg count — services take many deps
  "S101",                # assert is fine in tests (per-file-ignores reinforces)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "ARG001", "ARG002"]
"src/budget_planner/db/migrate.py" = ["S608"]  # dynamic SQL permitted here
"src/budget_planner/repositories/*.py" = ["S608"]  # column names from DTO fields, not user input
"src/budget_planner/web/routers/*.py" = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["budget_planner"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = ["src"]
packages = ["budget_planner", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "sqlfluff.*", "djlint.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=src/budget_planner",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-report=html",
  "--cov-fail-under=90",
  "-m",
  "not visual",
]
markers = [
  "unit: fast unit tests (default)",
  "integration: database or HTTP-backed tests",
  "e2e: full-stack smoke tests",
  "visual: Playwright visual-regression snapshots (ADR-0027 §4)",
]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:plotly.*",
]

[tool.coverage.run]
branch = true
source = ["src/budget_planner"]
omit = [
  "src/budget_planner/__main__.py",
  "src/budget_planner/web/templates/*",
]

[tool.coverage.report]
# T-043: 90% gate also enforced on bare `coverage report` invocations.
fail_under = 90
precision = 2
skip_covered = false
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# sqlfluff — SQL lint + format
# ---------------------------------------------------------------------------
[tool.sqlfluff.core]
dialect = "sqlite"
templater = "raw"
max_line_length = 100
exclude_rules = [
  "L034",  # select-ordering is noisy for migrations
  "RF04",  # `date` is a legitimate column name on fx_rates (per T-011 plan)
]

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

# ---------------------------------------------------------------------------
# djlint — Jinja template lint
# ---------------------------------------------------------------------------
[tool.djlint]
profile = "jinja"
max_line_length = 120
indent = 2
format_css = true
format_js = false

# ---------------------------------------------------------------------------
# bandit — security scan
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
# B101 (assert) is fine in tests; B608 (hardcoded SQL) is unavoidable in the
# repository layer where column names come from DTO fields (never from user
# input). The ruff S608 rule has an equivalent per-file-ignore.
skips = ["B101", "B608"]
