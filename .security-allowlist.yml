# Allowlist for CI security scanners (T-D13).
#
# Each entry MUST include:
#   - cve: CVE-YYYY-NNNNN (or scanner-specific id, e.g. GHSA-xxxx, DLA-xxxx).
#   - scanner: pip_audit | trivy_fs | trivy_image
#   - reason:  short justification (e.g. "upstream patch pending",
#              "false positive — not reachable from our code paths").
#   - expires: YYYY-MM-DD soft deadline. The CI jobs do NOT auto-reject on
#              expiry; the date exists so humans re-audit the entry.
#
# Scanners read the matching list and skip ONLY findings whose id appears
# below. Everything else is treated as a blocking HIGH/CRITICAL finding.
#
# The three lists are kept separate on purpose: a pip_audit entry is a
# Python dependency CVE, a trivy_fs entry is a filesystem-level finding
# (lockfile, config, embedded binary), and a trivy_image entry is an
# OS-package or image-layer CVE. The same CVE id may legitimately appear
# in more than one list; copy the entry rather than cross-linking.
#
# Keep this file sorted by cve within each list for easy diffing.

pip_audit: []
# Example (do not uncomment unless there is a real finding):
#   - cve: CVE-2026-00000
#     scanner: pip_audit
#     reason: "upstream fix pending in dep X; not reachable from our call sites"
#     expires: 2026-12-31

trivy_fs: []
# Example:
#   - cve: CVE-2026-00000
#     scanner: trivy_fs
#     reason: "false positive — matches vendored test fixture only"
#     expires: 2026-12-31

trivy_image: []
# Example:
#   - cve: CVE-2026-00000
#     scanner: trivy_image
#     reason: "base-image CVE; patched upstream in next Debian point release"
#     expires: 2026-12-31
