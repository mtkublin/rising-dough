name: Terraform inputs
description: >-
  Export every Terraform input as TF_VAR_* from the job's secrets and variables
  (T-D133, T-D70, ADR-0093). The mapping lives in scripts/ci/tf_env.py. Call it
  after checkout; later steps of the same job see the variables.

inputs:
  env:
    description: Target environment, drill or prod. Drill-only inputs are empty on prod (T-D137).
    required: true
  restore-source:
    description: "'true' only for the restore drill apply (gated prod-restore-read, ADR-0132): also export the prod replica read key."
    required: false
    default: "false"
  plan-only:
    description: "'true' for the PR plan job: on prod, Tailscale credentials are placeholders (T-Q309, ADR-0132); the caller must plan with -refresh=false."
    required: false
    default: "false"
  secrets-json:
    description: "Pass the toJSON of the secrets context (a composite action cannot read it)."
    required: true
  vars-json:
    description: "Pass the toJSON of the vars context."
    required: true

runs:
  using: composite
  steps:
    - name: Export TF_VAR_* inputs
      shell: bash
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
        VARS_JSON: ${{ inputs.vars-json }}
        TARGET_ENV: ${{ inputs.env }}
        RESTORE_SOURCE: ${{ inputs.restore-source }}
        PLAN_ONLY: ${{ inputs.plan-only }}
      run: |
        flag=()
        if [ "${RESTORE_SOURCE}" = "true" ]; then flag=(--restore-source); fi
        if [ "${PLAN_ONLY}" = "true" ]; then flag+=(--plan-only); fi
        python3 "${GITHUB_ACTION_PATH}/../../../scripts/ci/tf_env.py" --env "${TARGET_ENV}" "${flag[@]}"
