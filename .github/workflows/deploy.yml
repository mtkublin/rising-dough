# Deploy workflow (reusable) — SSH to the restricted `deploy` user on the
# Scaleway Stardust host over the tailnet (ADR-0037 §1, §3, ADR-0094).
#
# ADR-0099: no triggers of its own. Called by release.yml (env=prod, after
# build + terraform apply) and, pre-merge, by the drill validation workflow
# (env=drill, T-D90). Prod deploys are refused unless running from main.
#
# The host-side `deploy-budget-planner` script cosign-verifies, pulls, swaps,
# and probes `/ready`, auto-rolling back on failure. This workflow additionally
# probes the public `/ready` endpoint (the smoke test) and invokes `rollback`
# on failure as a belt-and-braces guard.
#
# Secrets expected (callers pass `secrets: inherit`):
#   DEPLOY_SSH_PRIVATE_KEY, DEPLOY_SSH_KNOWN_HOSTS, DRILL_HOST, PROD_HOST
#   (tailnet names, ADR-0094), TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
# Variables (vars.*): DRILL_URL, PROD_URL

name: deploy

on:
  workflow_call:
    inputs:
      env:
        description: Target environment (drill | prod)
        type: string
        required: true
      image_tag:
        description: Immutable image tag to deploy (sha-<short>)
        type: string
        required: true

permissions:
  contents: read
  deployments: write
  packages: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.env }}
      url: ${{ inputs.env == 'prod' && vars.PROD_URL || vars.DRILL_URL }}
    env:
      TARGET_ENV: ${{ inputs.env }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      TARGET_URL: ${{ inputs.env == 'prod' && vars.PROD_URL || vars.DRILL_URL }}
      TARGET_HOST: ${{ inputs.env == 'prod' && secrets.PROD_HOST || secrets.DRILL_HOST }}
    steps:
      - name: Validate inputs and ref guard (ADR-0099)
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            drill) ;;
            prod)
              if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
                echo "::error::prod deploys run only from main (got ${GITHUB_REF})" >&2
                exit 1
              fi ;;
            *) echo "::error::env must be drill or prod" >&2; exit 1 ;;
          esac
          if ! [[ "${IMAGE_TAG}" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::image_tag must look like sha-<hex>; got '${IMAGE_TAG}'" >&2
            exit 1
          fi

      - name: Create GitHub deployment (in_progress)
        id: deployment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const env = process.env.TARGET_ENV;
            const url = process.env.TARGET_URL;
            const tag = process.env.IMAGE_TAG;
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: env,
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: env === 'prod',
              description: `${env} deploy ${tag}`
            });
            core.setOutput('id', dep.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: url,
              description: 'SSH deploy starting'
            });

      - name: Connect to tailnet (SSH only over Tailscale, T-D67)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH deploy
        id: ssh-deploy
        run: |
          set -euo pipefail
          echo "::add-mask::${TARGET_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${TARGET_HOST}" "deploy ${IMAGE_TAG}"

      - name: Smoke test /ready
        id: probe
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "${TARGET_URL}/ready" >/dev/null; then
              echo "ready after attempt ${i}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${TARGET_ENV} /ready never came up" >&2
          exit 1

      - name: Rollback on probe failure
        if: failure() && steps.ssh-deploy.outcome == 'success'
        run: |
          set -euo pipefail
          echo "::add-mask::${TARGET_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${TARGET_HOST}" "rollback"

      - name: Finalize deployment status
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? 'success' : 'failure',
              environment_url: process.env.TARGET_URL,
              description: `${process.env.TARGET_ENV} deploy ${ok ? 'ok' : 'failed'} (${process.env.IMAGE_TAG})`
            });
