# Deploy workflow — drives drill (auto) then prod (manual approval) via SSH to
# the restricted `deploy` user on the Scaleway Stardust host (ADR-0037 §1, §3).
#
# Trigger: completion of the `build` workflow on `main`. Build publishes an
# immutable `sha-<short>` tag + cosign signature; we SSH the deploy user with
# that tag and the host-side `/usr/local/bin/deploy-budget-planner` script
# cosign-verifies, pulls, swaps, and probes `/ready`. Script auto-rolls back
# on probe failure; this workflow also probes the public `/ready` endpoint and
# invokes the rollback subcommand on failure as a belt-and-braces guard.
#
# Secrets expected:
#   DEPLOY_SSH_PRIVATE_KEY  — ed25519 key paired to deploy user's authorized_keys
#   DEPLOY_SSH_KNOWN_HOSTS  — ssh-keyscan output for drill + prod hosts
#   DRILL_HOST              — hostname SSH targets for drill env
#   PROD_HOST               — hostname SSH targets for prod env
# Variables (vars.*):
#   DRILL_URL               — https URL probed after drill deploy
#   PROD_URL                — https URL probed after prod deploy

name: deploy

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write
  packages: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  resolve-image:
    name: Resolve image tag
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      head-sha: ${{ steps.tag.outputs.head_sha }}
    steps:
      - name: Compute image tag from upstream build
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::missing workflow_run.head_sha" >&2
            exit 1
          fi
          SHORT="${HEAD_SHA:0:7}"
          TAG="sha-${SHORT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "resolved image tag: ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  deploy-drill:
    name: Deploy to drill
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: drill
      url: ${{ vars.DRILL_URL }}
    steps:
      - name: Create GitHub deployment (in_progress)
        id: deployment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.resolve-image.outputs.head-sha }}',
              environment: 'drill',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: false,
              description: 'drill deploy ${{ needs.resolve-image.outputs.image-tag }}'
            });
            core.setOutput('id', dep.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: '${{ vars.DRILL_URL }}',
              description: 'SSH deploy starting'
            });

      - name: Install SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH deploy to drill
        id: ssh-deploy
        env:
          DRILL_HOST: ${{ secrets.DRILL_HOST }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image-tag }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DRILL_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${DRILL_HOST}" "deploy ${IMAGE_TAG}"

      - name: Probe /ready (drill)
        id: probe
        env:
          URL: ${{ vars.DRILL_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "${URL}/ready" >/dev/null; then
              echo "ready after attempt ${i}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::drill /ready never came up" >&2
          exit 1

      - name: Rollback drill on probe failure
        if: failure() && steps.ssh-deploy.outcome == 'success'
        env:
          DRILL_HOST: ${{ secrets.DRILL_HOST }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DRILL_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${DRILL_HOST}" "rollback"

      - name: Finalize deployment status (success)
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'success',
              environment_url: '${{ vars.DRILL_URL }}',
              description: 'drill deploy ok (${{ needs.resolve-image.outputs.image-tag }})'
            });

      - name: Finalize deployment status (failure)
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'failure',
              environment_url: '${{ vars.DRILL_URL }}',
              description: 'drill deploy failed (${{ needs.resolve-image.outputs.image-tag }})'
            });

  deploy-prod:
    name: Deploy to prod
    needs: [resolve-image, deploy-drill]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    steps:
      - name: Create GitHub deployment (in_progress)
        id: deployment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.resolve-image.outputs.head-sha }}',
              environment: 'prod',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
              description: 'prod deploy ${{ needs.resolve-image.outputs.image-tag }}'
            });
            core.setOutput('id', dep.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'in_progress',
              environment_url: '${{ vars.PROD_URL }}',
              description: 'SSH deploy starting'
            });

      - name: Install SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: SSH deploy to prod
        id: ssh-deploy
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image-tag }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PROD_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" "deploy ${IMAGE_TAG}"

      - name: Probe /ready (prod)
        id: probe
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "${URL}/ready" >/dev/null; then
              echo "ready after attempt ${i}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::prod /ready never came up" >&2
          exit 1

      - name: Rollback prod on probe failure
        if: failure() && steps.ssh-deploy.outcome == 'success'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PROD_HOST}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "deploy@${PROD_HOST}" "rollback"

      - name: Finalize deployment status (success)
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'success',
              environment_url: '${{ vars.PROD_URL }}',
              description: 'prod deploy ok (${{ needs.resolve-image.outputs.image-tag }})'
            });

      - name: Finalize deployment status (failure)
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'failure',
              environment_url: '${{ vars.PROD_URL }}',
              description: 'prod deploy failed (${{ needs.resolve-image.outputs.image-tag }})'
            });
