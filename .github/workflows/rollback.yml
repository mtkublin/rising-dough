# Manual rollback (ADR-0111; replaces the SSH rollback of ADR-0037 §5).
#
# A rollback is one approved `terraform apply` that points the host's image ref
# back at an earlier image; the host agent cosign-verifies and converges, and
# terraform.yml waits for the host's status (prod).
#
# Operator picks `drill` or `prod` and optionally a `target`: a release version
# `vMAJOR.MINOR.PATCH` (ADR-0109), a `sha-<hex>` tag or a bare git SHA. Empty
# target = the previous ref recorded in Terraform state. An explicit target is
# resolved to its GHCR digest here, so the apply is digest-pinned like a
# release. Prod runs only from main or a v* tag on main (ADR-0099, ADR-0109).
#
# Secrets: those of terraform.yml (environment `prod` / `drill`, approval gate).

name: rollback

# T-D138: the env is visible in the run title so the drill lock can tell drill from prod.
run-name: rollback (${{ inputs.env }})

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        required: true
        options:
          - drill
          - prod
      target:
        description: >-
          Optional explicit target: vMAJOR.MINOR.PATCH, sha-<hex> or a git SHA
          (empty = the previous ref recorded in Terraform state)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rollback-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve rollback target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout (full history for the tag-on-main check)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ref guard (ADR-0099, ADR-0109)
        if: ${{ inputs.env == 'prod' }}
        run: python3 scripts/ci/ref_guard.py ref --ref "${GITHUB_REF}"

      - name: Resolve target to tag@digest
        id: resolve
        env:
          RAW_TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/budget-planner
        run: |
          set -euo pipefail
          if [ -z "${RAW_TARGET}" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "target: previous ref recorded in state"
            exit 0
          fi
          TAG="$(python3 scripts/ci/ref_guard.py rollback-target "${RAW_TARGET}")"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "ref=${TAG}@${DIGEST}" | tee -a "$GITHUB_OUTPUT"

  apply:
    name: rollback ${{ inputs.env }}
    needs: target
    # T-D121: reusable callee requests these; less is a startup_failure.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform.yml
    with:
      env: ${{ inputs.env }}
      image_ref: ${{ needs.target.outputs.ref }}
      rollback: true
    secrets: inherit  # pragma: allowlist secret
