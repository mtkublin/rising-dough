name: CI

# ADR-0099: pushes to main are handled by release.yml (ci -> build -> tf apply
# -> deploy), which calls this workflow via workflow_call. PRs run it directly.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: just ci (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node (dev-only toolchain — Tailwind + stylelint; ADR-0027)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.34.0"

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Install Node dev toolchain
        run: npm ci

      - name: Build Tailwind CSS (verifies the pre-commit tailwind-check contract)
        run: npm run css

      - name: Run full CI pipeline
        run: just ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30
