name: CI

# ADR-0099: pushes to main are handled by release.yml (ci -> build -> tf apply
# -> deploy), which calls this workflow via workflow_call. PRs run it directly.
on:
  pull_request:
    branches: [main]
  workflow_call:

# T-Q255 (Q-068): least-privilege default; nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: just ci (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@5f42d5af6c403a722299fda36d451c39f302a433 # v4.1.0
        with:
          version: "0.11.2"  # ADR-0120 amendment: pinned (T-Q240)
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node (dev-only toolchain — Tailwind + stylelint; ADR-0027)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.34.0"

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Install Node dev toolchain
        run: npm ci

      # ADR-0130 §8: CI runs every pre-commit hook locally enforced. Only the
      # testmon-selected pytest hook is skipped; the full suite + coverage run
      # in "Run full CI pipeline" below. Runs before the Tailwind build so the
      # tailwind-check hook sees the committed CSS. All hooks run on a plain
      # ubuntu runner: stylelint/tailwind-check use the npm toolchain installed
      # above, lint-imports uses the uv env, remote hooks bring their own envs.
      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks (parity with local, ADR-0130 §8)
        env:
          SKIP: pytest-fast
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Build Tailwind CSS (verifies the pre-commit tailwind-check contract)
        run: npm run css

      # ADR-0108 §3 / T-CS05: mypy stays whole-repo; the incremental cache
      # makes reruns cheap. Exact key = deps + every checked file; the
      # restore-key falls back to the newest cache for the same deps.
      - name: Cache mypy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py', 'tests/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-

      - name: Run full CI pipeline
        env:
          # ADR-0108 §1: one xdist worker per runner core.
          PYTEST_WORKERS: auto
        run: just ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # T-Q311 (ADR-0140 amendment 2026-11-23): the suite runs on dangerous dates, so a
  # date-dependent test fails on the PR instead of "after midnight". Not a required
  # check by itself; `just ci` above runs the default frozen instant.
  pytest-shifted-clock:
    name: pytest (shifted clock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        now:
          - "2027-01-31T23:30:00Z" # month end
          - "2028-02-29T12:00:00Z" # leap day
          - "2026-12-31T23:30:00Z" # year end
          - "2027-03-28T01:30:00Z" # Europe/Warsaw DST switch day
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@5f42d5af6c403a722299fda36d451c39f302a433 # v4.1.0
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Run the suite with the clock frozen at ${{ matrix.now }}
        env:
          BUDGET_TEST_NOW: ${{ matrix.now }}
        run: uv run pytest -q --no-cov -n auto --dist loadgroup -m "not e2e and not visual and not smoke" --ignore=tests/e2e
