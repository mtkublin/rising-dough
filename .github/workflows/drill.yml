# Drill deploy pipeline (T-D90, ADR-0099 decision 3): build -> terraform apply
# drill -> smoke. Runs on the ephemeral `drill` environment only; never touches prod.
#
# Triggers
#   push `*-deploy` branches   deploy the branch to drill; kept until the TTL expires
#                              (default 60 min) and then swept by drill-sweeper.yml.
#   workflow_dispatch          same, with `ttl_minutes` (15..480), `keep` (false =
#                              tear down right after the smoke test) and `boot_logs`.
#   pull_request -> main       pre-merge gate: apply + smoke, ALWAYS torn down at the
#                              end (even when apply/smoke failed). The PR's CI run is
#                              the separate ci.yml PR run, so `ci` is not repeated here.
#
# Smoke instead of deploy.yml (documented in ADR-0099, Amendment 2026-11-07):
# every drill apply replaces the server (and the tailnet key), and a fresh boot
# runs cloud-init, which already pulls and starts `app_image_tag` (= the tag built
# here). deploy.yml's SSH swap would re-pull the same image: a no-op that adds a
# tailnet join and a race with cloud-init. The smoke job instead waits for the
# public /ready (fresh boot to ready takes ~3.5 min; the budget is 10 min).
#
# Concurrency: group `drill` is shared with restore-drill.yml, the sweeper and
# drill-destroy.yml; runs queue, never cancel a running apply/destroy.
#
# Environment `drill` secrets/vars: see terraform.yml / restore-drill.yml headers;
# vars.DRILL_URL (public URL of the drill host).

name: drill

on:
  push:
    branches: ["**-deploy"]
  workflow_dispatch:
    inputs:
      ttl_minutes:
        description: Minutes until the sweeper destroys the drill (15..480)
        type: number
        required: false
        default: 60
      keep:
        description: Keep the drill up until the TTL (false = destroy right after smoke)
        type: boolean
        required: false
        default: true
      boot_logs:
        description: Upload boot diagnostics to the drill bucket (boot_log_upload, ADR-0094)
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Pull requests already run ci.yml on their own; push/dispatch run it here.
  ci:
    name: ci
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    secrets: inherit  # pragma: allowlist secret

  build:
    name: build
    needs: ci
    # ci is skipped on pull_request; anything else must have passed.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build.yml
    secrets: inherit  # pragma: allowlist secret

  ttl:
    name: compute expiry
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      expires-at: ${{ steps.ttl.outputs.expires_at }}
    steps:
      - name: Compute expires-at (RFC3339 UTC)
        id: ttl
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TTL: ${{ inputs.ttl_minutes }}
        run: |
          set -euo pipefail
          # PR runs are torn down by the teardown job; the 120 min tag is the
          # sweeper's backstop if teardown itself fails.
          ttl=60
          if [ "${EVENT}" = "pull_request" ]; then ttl=120; fi
          if [ "${EVENT}" = "workflow_dispatch" ] && [ -n "${INPUT_TTL}" ]; then ttl="${INPUT_TTL}"; fi
          if ! [[ "${ttl}" =~ ^[0-9]+$ ]] || [ "${ttl}" -lt 15 ] || [ "${ttl}" -gt 480 ]; then
            echo "::error::ttl_minutes must be an integer in 15..480 (got '${ttl}')" >&2
            exit 1
          fi
          echo "expires_at=$(date -u -d "+${ttl} minutes" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  apply:
    name: terraform apply (drill)
    needs: [build, ttl]
    uses: ./.github/workflows/terraform.yml
    with:
      env: drill
      image_tag: ${{ needs.build.outputs.image-tag }}
      replace: module.compute.scaleway_instance_server.app tailscale_tailnet_key.vm
      drill_expires_at: ${{ needs.ttl.outputs.expires-at }}
      boot_log_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.boot_logs }}
    secrets: inherit  # pragma: allowlist secret

  smoke:
    name: smoke (/ready)
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: drill
      url: ${{ vars.DRILL_URL }}
    permissions: {}
    env:
      TARGET_URL: ${{ vars.DRILL_URL }}
    steps:
      - name: Wait for /ready (fresh boot ~3.5 min, budget 10 min)
        run: |
          set -euo pipefail
          if [ -z "${TARGET_URL}" ]; then
            echo "::error::vars.DRILL_URL is not set in environment drill" >&2
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "${TARGET_URL}/ready" >/dev/null; then
              echo "drill /ready OK after attempt ${i}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::drill /ready never came up within 10 minutes" >&2
          exit 1

  # Pull requests (always) and dispatches with keep=false: destroy even when the
  # apply or smoke failed, as long as apply was attempted (a partial apply can
  # leave resources behind). Push and keep=true runs stay up until the TTL.
  teardown:
    name: teardown (drill)
    needs: [apply, smoke]
    if: >-
      ${{ always() && needs.apply.result != 'skipped' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.keep)) }}
    uses: ./.github/workflows/terraform.yml
    with:
      env: drill
      # Placeholder: app_image_tag is only rendered into user-data, which a
      # -destroy plan never creates (terraform.yml accepts any valid tag).
      image_tag: sha-0000000
      destroy: true
    secrets: inherit  # pragma: allowlist secret
