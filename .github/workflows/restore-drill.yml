# Monthly automated restore drill (T-D41, ADR-0034 §5).
#
# Provisions a disposable Scaleway drill environment through terraform.yml
# (apply and destroy are the shared reusable jobs, T-D133), restores
# `/data/budget.db` from the prod Litestream bucket (read-only credential
# baked into the drill cloud-init), verifies integrity + readiness, then
# tears the environment down ALWAYS (T-D66): success, failure or cancel. On
# failure, best-effort debugging evidence is captured over SSH and uploaded as
# a workflow artifact BEFORE destroy, then a GitHub issue is opened. A forgotten
# failed drill host would cost ~EUR 4.46/month, so cost stays bounded per run.
#
# Secrets (environment-scoped to `drill`):
#   SCW_ACCESS_KEY, SCW_SECRET_KEY
#   SCW_DEFAULT_PROJECT_ID         - the DRILL project (rising-dough-drill, ADR-0092).
#   DEPLOY_SSH_PRIVATE_KEY         - ed25519 private key for operator SSH.
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET
#                                  - Tailscale OAuth client (scopes auth_keys; owns tag:ci,
#                                    tag:drill): CI joins the tailnet as tag:ci and Terraform
#                                    mints the drill host's ephemeral auth key (T-D67).
#   PROD_REPLICA_RO_ACCESS_KEY / PROD_REPLICA_RO_SECRET_KEY
#                                  - read-only key of the prod `restore-reader`
#                                    IAM application (terraform/bootstrap/ci outputs
#                                    restore_reader_access_key/_secret_key;
#                                    ADR-0092, ADR-0104, T-D41a).
#   APP_APPLICATION_ID, APP_SCW_ACCESS_KEY / APP_SCW_SECRET_KEY
#                                  - drill Litestream identity (terraform/bootstrap/ci
#                                    module.app_drill; ADR-0104).
#   LITESTREAM_AGE_IDENTITY        - PROD age identity (T-D56); decrypts the replica.
#   LITESTREAM_AGE_RECIPIENT       - matching public age1... recipient (T-D56; a secret since ADR-0093).
#   Plus every other TF_VAR_* input: see scripts/ci/tf_env.py and operator-checklist A5 (ADR-0093).
#
# Third-party actions pinned by SHA (ADR-0037 §2 image-signing rationale
# applies to our CI supply chain as well).

name: Restore drill

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "OPERATOR ONLY. Skip the drill-VM and tailnet checks of the drill lock (T-D138). Can replace and destroy a running explore drill. The other-run check always applies."
        type: boolean
        required: false
        default: false

concurrency:
  group: drill # shared drill group with the pre-merge drill validation (ADR-0099)
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  # T-D138 (ADR-0115): FIRST job. Fails the run when another drill run is active or
  # (unless noted) a drill VM / online tag:drill node exists. Runs inside the `drill`
  # concurrency group, so no other run can create a VM while it evaluates.
  drill-lock:
    name: drill lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drill-teardown # ungated; holds SCW_SECRET_KEY and TS_CLEANUP_*
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      TS_CLEANUP_CLIENT_ID: ${{ secrets.TS_CLEANUP_CLIENT_ID }}
      TS_CLEANUP_SECRET: ${{ secrets.TS_CLEANUP_SECRET }}
      DRILL_LOCK_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/drill_lock.py
            scripts/tailnet_drill_cleanup.py

      - name: Acquire drill lock
        run: python3 scripts/ci/drill_lock.py

  # ADR-0111: the host runs a digest-pinned, cosign-verified image. Use the
  # newest GitHub release (prod's line), or `main` before the first one.
  image:
    name: Resolve app image
    needs: drill-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/host_release.py

      - name: Resolve app image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/budget-planner
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')"
          TAG="${TAG:-main}"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          python3 scripts/ci/host_release.py resolve-ref --image "${IMAGE}" --tag "${TAG}" | tee -a "$GITHUB_OUTPUT"

  # T-D133: apply is the shared terraform.yml job (environment `drill`, the one
  # optional reviewer gate, none configured today; no replace and no expires-at tag, as before).
  apply:
    name: terraform apply (drill)
    needs: [drill-lock, image]
    # T-D121: reusable callee requests these; less is a startup_failure.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform.yml
    with:
      env: drill
      image_ref: ${{ needs.image.outputs.ref }}
    secrets: inherit  # pragma: allowlist secret

  restore-drill:
    name: Restore → verify
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: drill # holds DEPLOY_SSH_PRIVATE_KEY (only in `drill`); no reviewers configured today
    permissions:
      contents: read
      actions: read # run start time for the restore-log entry (T-D41)
    env:
      # ADR-0101: tailnet-only drill; probe the MagicDNS name (runner is on the tailnet).
      DRILL_HOST: budget-planner-drill-${{ github.run_id }}.${{ vars.TAILNET_DNS_NAME }}
      # T-D67 / ADR-0094: SSH goes over the tailnet (port 22 is closed publicly);
      # DRILL_HOST stays the public name for the HTTPS /ready probe.
      DRILL_SSH_HOST: budget-planner-drill-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Connect to tailnet (SSH only over Tailscale, T-D67)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare ~/.ssh
        # known_hosts is filled later by ssh-keyscan over the tailnet (ADR-0094).
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Wait for drill host on the tailnet (T-D67)
        # The drill VM joins the tailnet from cloud-init (ephemeral node).
        # Bounded wait until its MagicDNS name answers on 22, then record its
        # host keys. ssh-keyscan over the tailnet is trustworthy: the peer is
        # authenticated by WireGuard node identity and the ACL (tag:ci ->
        # tag:drill:22 only), so this is not trust-on-first-use over the internet.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for i in $(seq 1 60); do
            keys="$(ssh-keyscan -T 5 -t ed25519,ecdsa,rsa "${DRILL_SSH_HOST}" 2>/dev/null || true)"
            if [ -n "${keys}" ]; then
              printf '%s\n' "${keys}" >> ~/.ssh/known_hosts
              echo "drill host reachable on the tailnet after attempt ${i}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${DRILL_SSH_HOST} never answered on port 22 over the tailnet" >&2
          exit 1

      - name: Verify operator SSH login (T-D41)
        # First-run lesson (run 44297154259): sshd answered on the tailnet but
        # rejected the key. Compare the agent key with OPERATOR_SSH_PUBKEY (public
        # fingerprints only, safe to print), then retry the login while cloud-init
        # finishes writing authorized_keys. Prints the ssh -v tail on final failure.
        timeout-minutes: 8
        env:
          OPERATOR_SSH_PUBKEY: ${{ secrets.OPERATOR_SSH_PUBKEY }}
        run: |
          set -uo pipefail
          echo "authorized key fingerprint: $(printf '%s\n' "${OPERATOR_SSH_PUBKEY}" | ssh-keygen -lf - 2>&1)"
          echo "agent key fingerprints:"; ssh-add -l || true
          for i in $(seq 1 12); do
            if ssh -o BatchMode=yes -o ConnectTimeout=10 operator@"${DRILL_SSH_HOST}" true; then
              echo "operator SSH login ok (attempt ${i})"
              exit 0
            fi
            sleep 10
          done
          ssh -vv -o BatchMode=yes -o ConnectTimeout=10 operator@"${DRILL_SSH_HOST}" true 2>&1 | tail -n 40 || true
          echo "::error::operator SSH login to ${DRILL_SSH_HOST} failed" >&2
          exit 1

      # Readiness review: `cloud-init status --wait` alone does not prove the host
      # agent converged. If its first convergence failed and is in back-off, a retry
      # could run `compose up -d` mid-restore. Wait (bounded) until the agent reports
      # this generation applied (state ok) and the expected image running.
      - name: Wait for host agent status ok
        timeout-minutes: 12
        env:
          GENERATION: ${{ needs.apply.outputs.host_config_generation }}
          HOST_IMAGE_REF: ${{ needs.apply.outputs.host_image_ref }}
        run: >-
          python3 scripts/ci/host_release.py wait --timeout 600
          --url "https://${DRILL_HOST}/.well-known/bp-deploy-status.json"
          --generation "${GENERATION}" --ref "${HOST_IMAGE_REF}"

      - name: Trigger restore on drill host
        # The helper lives at /usr/local/bin/restore-from-prod (written by the
        # host agent from bp-config, ADR-0111; cloud-init's runcmd runs the
        # first convergence, so `cloud-init status --wait` covers it) and
        # (per ADR-0034 §5 + the drill terraform.tfvars) runs
        #   litestream restore -o /data/budget.db s3://budget-planner-prod-pl-waw/db
        # using a read-only IAM credential scoped to the prod bucket.
        # T-D41: the output is kept in restore-output.log; only validated fields
        # (generation, index range, source) reach the restore-log entry. The helper
        # never prints secrets.
        id: restore
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes operator@"${DRILL_SSH_HOST}" \
            'sudo cloud-init status --wait >/dev/null; sudo /usr/local/bin/restore-from-prod' \
            2>&1 | tee restore-output.log
          echo "restored_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Verify /ready reports ready, db ok
        id: ready
        run: |
          set -euo pipefail
          body="$(curl -fsS "https://${DRILL_HOST}/ready")"
          status="$(jq -r .status <<<"${body}")"
          db="$(jq -r .db <<<"${body}")"
          echo "ready.status=${status} ready.db=${db}"
          echo "ready_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "state=${status}-${db}" | tr -c "A-Za-z0-9_=\n-" "-" >> "$GITHUB_OUTPUT"
          test "${status}" = "ready"
          test "${db}" = "ok"

      - name: Verify PRAGMA integrity_check
        id: integrity
        run: |
          set -euo pipefail
          result="$(ssh -o BatchMode=yes operator@"${DRILL_SSH_HOST}" \
            "sudo sqlite3 /data/budget.db 'PRAGMA integrity_check;'")"
          echo "integrity_check=${result}"
          echo "value=$(printf '%s' "${result}" | tr -c 'A-Za-z0-9_-' '-' | cut -c1-40)" >> "$GITHUB_OUTPUT"
          test "${result}" = "ok"

      - name: Verify no extra DB copies remain (T-D57)
        id: copies
        # ADR-0078 section 4: only the live budget.db (+ -wal/-shm) may be left under
        # /data; moved-aside and pre-migration copies are deleted by the helper.
        run: |
          set -euo pipefail
          extra="$(ssh -o BatchMode=yes operator@"${DRILL_SSH_HOST}" \
            "sudo find /data -name '*.db*' ! -path '/data/.budget.db-litestream*' ! -name budget.db ! -name budget.db-wal ! -name budget.db-shm")"
          echo "extra_db_copies=[${extra}]"
          if [ -z "${extra}" ]; then echo "value=none" >> "$GITHUB_OUTPUT"; else echo "value=found" >> "$GITHUB_OUTPUT"; fi
          test -z "${extra}"

      # T-D41: read-only stats of the restored DB for the restore-log entry. Never
      # blocks the run; the sqlite3 -readonly flag keeps the restored file untouched.
      - name: Collect restored audit_log stats (read-only)
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -uo pipefail
          out="$(timeout 60 ssh -o BatchMode=yes -o ConnectTimeout=10 operator@"${DRILL_SSH_HOST}" \
            "sudo sqlite3 -readonly -separator '|' /data/budget.db 'SELECT count(*), max(id), max(changed_at) FROM audit_log;'" 2>/dev/null || true)"
          echo "audit_log=${out}"
          echo "stats=${out}" >> "$GITHUB_OUTPUT"

      # T-D41: the entry for restore-log.md, built on success AND failure. It goes to the
      # job summary and, through the `restore-log` job, to the restore-log issue.
      - name: Build restore-log entry
        id: entry
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REF: ${{ needs.apply.outputs.host_image_ref }}
          AUDIT_STATS: ${{ steps.audit.outputs.stats }}
          INTEGRITY: ${{ steps.integrity.outputs.value }}
          READY_STATE: ${{ steps.ready.outputs.state }}
          READY_AT: ${{ steps.ready.outputs.ready_at }}
          EXTRA_COPIES: ${{ steps.copies.outputs.value }}
          RESTORED_AT: ${{ steps.restore.outputs.restored_at }}
        run: |
          set -uo pipefail
          started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)"
          touch restore-output.log
          result=fail
          if [ "${JOB_STATUS}" = "success" ]; then result=pass; fi
          python3 scripts/ci/restore_log_entry.py \
            --result "${result}" --trigger "${EVENT_NAME}" --run-url "${RUN_URL}" \
            --image-ref "${IMAGE_REF}" --restore-output restore-output.log \
            --audit "${AUDIT_STATS}" --integrity "${INTEGRITY}" --ready "${READY_STATE}" \
            --extra-copies "${EXTRA_COPIES}" --started-at "${started}" --ready-at "${READY_AT}" \
            --restored-at "${RESTORED_AT}" > restore-log-entry.md
          cat restore-log-entry.md
          { echo "### Restore-log entry"; echo; cat restore-log-entry.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload restore-log entry
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: restore-log-entry
          path: restore-log-entry.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Capture debugging evidence (best-effort)
        # T-D66: runs only on failure, BEFORE destroy. Never blocks destroy:
        # continue-on-error + hard timeouts. Secret-bearing files (env files,
        # compose files, restore-source.env, age identity) are never read;
        # log output is passed through a coarse key/secret redaction.
        if: failure()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          mkdir -p drill-evidence
          ssh_run() {
            timeout 60 ssh -o BatchMode=yes -o ConnectTimeout=10 \
              operator@"${DRILL_SSH_HOST}" "$1" 2>&1 \
              | sed -E 's/(secret|token|password|access_key|identity|AGE-SECRET-KEY)[^[:space:]]*/\1=REDACTED/Ig'
          }
          ssh_run 'sudo tail -n 500 /var/log/cloud-init-output.log' > drill-evidence/cloud-init-output.log || true
          ssh_run 'sudo journalctl -u docker -u cloud-final --no-pager -n 500' > drill-evidence/journal.log || true
          for svc in app litestream caddy; do
            ssh_run "cd /etc/budget-planner && sudo docker compose logs --no-color --tail 500 ${svc}" \
              > "drill-evidence/compose-${svc}.log" || true
          done
          ssh_run 'cd /etc/budget-planner && sudo docker compose ps -a' > drill-evidence/compose-ps.log || true
          ssh_run 'df -h; free -m; ls -la /data' > drill-evidence/host-state.log || true
          ls -la drill-evidence

      - name: Upload debugging evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: restore-drill-evidence
          path: drill-evidence/
          if-no-files-found: ignore
          retention-days: 30

  # T-D66: ALWAYS destroy once apply was attempted, even after a failed restore,
  # a partial apply or cancellation (shared terraform.yml, ungated drill-teardown).
  destroy:
    name: terraform destroy (drill)
    needs: [apply, restore-drill]
    if: ${{ always() && needs.apply.result != 'skipped' }}
    # T-D121: reusable callee requests these; less is a startup_failure.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform.yml
    with:
      env: drill
      destroy: true
    secrets: inherit  # pragma: allowlist secret

  # Fails the run loudly if destroy failed or resources remain, so the failure
  # issue fires and the operator knows something billable may remain.
  verify-destroy:
    name: Verify drill environment destroyed
    needs: destroy
    if: ${{ always() && needs.destroy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: drill-teardown # ungated; holds the drill state-backend credentials
    permissions:
      contents: read
    env:
      DESTROY_RESULT: ${{ needs.destroy.result }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Verify drill state is empty
        run: |
          set -euo pipefail
          if [ "${DESTROY_RESULT}" != "success" ]; then
            echo "::error::terraform destroy result=${DESTROY_RESULT}; drill resources may still be billing"
            exit 1
          fi
          terraform init -input=false -backend-config=envs/drill/backend.hcl
          remaining="$(terraform state list | grep -v '^data\.' || true)"
          if [ -n "${remaining}" ]; then
            echo "::error::resources remain in drill state after destroy:"
            echo "${remaining}"
            exit 1
          fi
          echo "drill state empty; destroy verified"

  # T-D124 (ADR-0101), T-D133: one reusable workflow removes the node the destroyed
  # VM leaves behind. Runs even when destroy failed (node may exist).
  tailnet-cleanup:
    name: remove drill tailnet node
    needs: destroy
    if: ${{ always() && needs.destroy.result != 'skipped' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tailnet-cleanup.yml
    secrets: inherit  # pragma: allowlist secret

  # Opens the failure issue when the drill itself or its teardown failed. A refusal
  # by the drill lock (everything else skipped) opens none, as before.
  report:
    name: Open issue on failure
    needs: [image, apply, restore-drill, destroy, verify-destroy]
    if: >-
      ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drill-teardown # ungated; reads vars.TAILNET_DNS_NAME
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRILL_HOST: budget-planner-drill-${{ github.run_id }}.${{ vars.TAILNET_DNS_NAME }}
    steps:
      - name: Open issue on failure
        env:
          REPO: ${{ github.repository }}
          DESTROY_OUTCOME: ${{ needs.destroy.result }}
          VERIFY_OUTCOME: ${{ needs.verify-destroy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="restore-drill-failure-$(date +%Y-%m)"
          if [ "${DESTROY_OUTCOME}" = "success" ] && [ "${VERIFY_OUTCOME}" = "success" ]; then
            destroy_line="The drill host (\`${DRILL_HOST}\`) was destroyed and verified (T-D66); nothing billable remains."
          else
            destroy_line="**WARNING: destroy failed or could not be verified (destroy=${DESTROY_OUTCOME}, verify=${VERIFY_OUTCOME}). Drill resources may still be billing (~EUR 4.46/month). Run \`terraform destroy\` in \`terraform/\` (drill backend; local drill tfvars or the TF_VAR_* inputs) manually.**"
          fi
          body=$(cat <<EOF
          Automated restore drill failed.

          - Workflow run: ${RUN_URL}
          - ${destroy_line}
          - Debugging evidence (cloud-init, journal, app/litestream/caddy logs) is attached to the run as the \`restore-drill-evidence\` artifact (30 days).
          - Next step: read the artifact, fix the root cause, then re-run the workflow via workflow_dispatch.

          Per ADR-0034 §5 this blocks the next monthly drill until closed.
          EOF
          )
          # The issue call fails on unknown labels (first run: "label not found").
          gh label create restore-drill --repo "${REPO}" --color 5319e7 --description "Automated restore drill" 2>/dev/null || true
          gh label create incident --repo "${REPO}" --color d73a4a --description "Operational incident" 2>/dev/null || true
          gh issue create \
            --repo "${REPO}" \
            --title "${title}" \
            --body "${body}" \
            --label "restore-drill,incident"

  # T-D41 (user decision 2026-11-18): main is protected, so the workflow cannot commit
  # the entry. Every run that reached the restore job appends its entry as a comment on
  # the single open `restore-log` issue (created with its label when missing). Failed
  # runs post `Result: fail`; the failure issue below is unchanged.
  restore-log:
    name: Post restore-log entry
    needs: restore-drill
    if: ${{ always() && needs.restore-drill.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drill-teardown # ungated; no secrets beyond the job token
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download restore-log entry
        id: download
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: restore-log-entry

      - name: Comment on the restore-log issue
        if: ${{ steps.download.outcome == 'success' }}
        run: |
          set -euo pipefail
          gh label create restore-log --repo "${REPO}" --color 0e8a16 --description "Restore drill results" 2>/dev/null || true
          number="$(gh issue list --repo "${REPO}" --label restore-log --state open \
            --json number,title --jq '[.[] | select(.title == "restore-log")][0].number // empty')"
          if [ -z "${number}" ]; then
            url="$(gh issue create --repo "${REPO}" --title restore-log --label restore-log \
              --body "Append-only log of restore drill results, one comment per run (T-D41). Posted by restore-drill.yml; do not close. Format: docs/plans/v3/runbooks/restore-log.md.")"
            number="${url##*/}"
          fi
          gh issue comment "${number}" --repo "${REPO}" --body-file restore-log-entry.md
