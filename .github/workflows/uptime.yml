# T-D44: prod uptime check. Every 5 minutes: GET /health, and read the host
# agent status (ADR-0111). A down app or a host agent in state `failed` fails
# the run (GitHub emails the operator on a failed scheduled run) and opens one
# issue; the first green run afterwards closes it. No secrets, no environment.
#
# Limits: GitHub may start scheduled runs late (minutes), and a GitHub outage
# hides a prod outage. Runbook: docs/plans/v3/runbooks/disaster-recovery.md.

name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: true

env:
  # Public prod hostname (subdomain_prod + domain); not a secret.
  PROD_BASE_URL: https://budget.rising-dough.eu
  ISSUE_TITLE: "Prod uptime check failing"

jobs:
  check:
    name: Prod health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check /health and host agent status
        id: probe
        run: |
          set -uo pipefail
          problems=()
          if ! curl -fsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 15 \
              "${PROD_BASE_URL}/health" >/dev/null; then
            problems+=("/health did not return 200")
          fi
          status="$(curl -fsS --retry 2 --retry-delay 10 --retry-all-errors --max-time 15 \
              "${PROD_BASE_URL}/.well-known/bp-deploy-status.json" || true)"
          if [ -z "${status}" ]; then
            echo "::notice::host agent status not available (host not migrated to ADR-0111 yet?)"
          else
            state="$(jq -r '.state // "unknown"' <<<"${status}")"
            error="$(jq -r '.error // ""' <<<"${status}")"
            echo "host agent: state=${state} error=${error}"
            if [ "${state}" = "failed" ]; then
              problems+=("host agent state failed (${error})")
            fi
          fi
          if [ "${#problems[@]}" -gt 0 ]; then
            printf '%s\n' "${problems[@]}" > problems.txt
            printf '::error::%s\n' "${problems[@]}"
            exit 1
          fi
          echo "OK"

      - name: Open an issue on failure
        if: ${{ failure() && steps.probe.outcome == 'failure' }}
        run: |
          set -euo pipefail
          found="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -z "${found}" ]; then
            body="$(printf 'First failure: %s\n\n%s\n\nRun: %s/%s/actions/runs/%s\n\nRunbook: docs/plans/v3/runbooks/disaster-recovery.md. Auto-opened by the Uptime workflow; closed by the next green run.' \
              "$(date -u +%FT%TZ)" "$(sed 's/^/- /' problems.txt)" \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
            gh issue create --title "${ISSUE_TITLE}" --body "${body}"
          fi

      - name: Close the issue on recovery
        if: ${{ success() }}
        run: |
          set -euo pipefail
          found="$(gh issue list --state open --search "\"${ISSUE_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${found}" ]; then
            gh issue close "${found}" --comment "Recovered at $(date -u +%FT%TZ) (run ${GITHUB_RUN_ID})."
          fi
