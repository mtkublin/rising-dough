name: Mutation

# ADR-0131: weekly advisory mutation run over domain + services. Never a merge
# gate; fails only when a package score falls more than 2 points below the
# baseline in scripts/mutation_baseline.json. No secrets, read-only token.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutate:
    name: mutmut (domain + services)
    runs-on: ubuntu-latest
    # No runner timing exists yet (ADR-0131 §4: 18-35 min locally). Generous
    # until the first scheduled run gives a measured value.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@5f42d5af6c403a722299fda36d451c39f302a433 # v4.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: "1.34.0"

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Run mutmut
        env:
          PYTEST_WORKERS: "2"
        run: just mutate

      - name: Report and check against baseline
        if: always()
        run: |
          set -o pipefail
          uv run python scripts/mutate_report.py --json mutation-scores.json --check | tee mutation-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: mutation-report
          path: |
            mutation-report.txt
            mutation-scores.json
          if-no-files-found: ignore
          retention-days: 30
