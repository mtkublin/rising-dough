name: e2e

# ADR-0120 amendment 2026-11-22 (T-Q295): an agent that genuinely needs the full
# e2e suite pushes its wi/** work branch and reads this run instead of running
# the suite locally. T-Q297 (ADR-0120 amendment 2026-11-22): also runs on every PR
# to main and is a required check on main; keep the job name stable (it is the
# check context). The orchestrator may also dispatch it by hand for any ref.
on:
  push:
    branches: ["wi/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to test (default: the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: tests/e2e (Chromium, Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same pinned image as the visual job (T-Q251); matches the playwright pin in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@5f42d5af6c403a722299fda36d451c39f302a433 # v4.1.0
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Run e2e journeys (2 workers, no coverage)
        run: >-
          uv run pytest tests/e2e -q -n 2 --no-cov
          --override-ini="addopts=-ra --strict-config --strict-markers"
          --junitxml=e2e-junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: e2e-failure
          path: |
            e2e-junit.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-browsers:
    # Advisory (ADR-0120 amendment 2026-11-23, T-Q299): not a required check until green on 3 PRs.
    name: tests/e2e (${{ matrix.browser }}, Playwright container, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # Same pinned image as the visual job (T-Q251); matches the playwright pin in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@5f42d5af6c403a722299fda36d451c39f302a433 # v4.1.0
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --group dev --frozen

      - name: Run e2e journeys (2 workers, no coverage)
        run: >-
          uv run pytest tests/e2e -q -n 2 --no-cov
          --override-ini="addopts=-ra --strict-config --strict-markers"
          --e2e-browser=${{ matrix.browser }}
          --junitxml=e2e-junit.xml

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: e2e-failure-${{ matrix.browser }}
          path: |
            e2e-junit.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 7
