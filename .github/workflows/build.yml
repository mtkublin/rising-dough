# Build + publish signed container images.
#
# ADR-0037 §2 — Immutable SHA-tagged images; cosign keyless-signed via GitHub OIDC.
# ADR-0099: only reusable (called by release.yml after ci passes) or manually
# dispatched from main. No push / tag / release triggers. The image tag and
# digest are exposed as workflow_call outputs for terraform apply + deploy.
#
# Pinned third-party actions by 40-char SHA (never floating tags). Update the
# comment next to each pin when bumping, and verify the new SHA against the
# tag's release notes.

name: build

on:
  workflow_call:
    outputs:
      image-tag:
        description: Primary immutable image tag (sha-<short>)
        value: ${{ jobs.build-and-push.outputs.image-tag }}
      image-digest:
        description: Image manifest digest (sha256:...)
        value: ${{ jobs.build-and-push.outputs.image-digest }}
      image-ref:
        description: Full primary image reference (registry/name:sha-<short>)
        value: ${{ jobs.build-and-push.outputs.image-ref }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/budget-planner

jobs:
  build-and-push:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Guard: manual dispatch only from main (ADR-0099).
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.image-ref.outputs.tag }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: |
          SHORT="${GITHUB_SHA::7}"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Record primary image ref
        id: image-ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          REF="${REGISTRY}/${IMAGE_NAME}:sha-${SHORT}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          {
            echo "## Build summary"
            echo
            echo "- Primary tag: \`${REF}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo "### All pushed tags"
            echo
            while IFS= read -r tag; do
              [ -n "${tag}" ] && echo "- \`${tag}\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

  cosign-sign:
    name: Cosign keyless sign
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c  # v3.8.1

      - name: Sign all pushed tags
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          TAGS: ${{ needs.build-and-push.outputs.image-tags }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ] || [ -z "${TAGS}" ]; then
            echo "::error::missing digest or tags from build job" >&2
            exit 1
          fi
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            echo "signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
