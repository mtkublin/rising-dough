name: Visual

# ADR-0027 amendment 2026-11-22 (T-Q251). The visual regression suite runs
# (a) on PRs to main, but only does work when the PR touches templates, CSS or
# static JS; otherwise the required `visual-gate` check is auto-satisfied
# (skipped job -> success), mirroring the drill gate skip (ADR-0121);
# (b) weekly; (c) on demand. It runs in a pinned Playwright container
# (tag + digest; the tag equals the `playwright` version in uv.lock, checked by
# tests/architecture/test_visual_image_pin.py). Baselines are Linux-only and
# regenerated only here or via `just visual-update`; `update_baselines` uploads
# them as an artifact and never commits. No secrets, no environments.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 4 * * 1" # Mondays 04:43 UTC
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate baselines and upload them as an artifact (never commits)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$files" | grep -Eq '^(src/budget_planner/web/templates/|src/budget_planner/web/static/|tests/visual/|docs/design/rising-dough-frontend/|scripts/ci/visual_in_container\.sh$|\.github/workflows/visual\.yml$|package(-lock)?\.json$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No template, CSS, static JS or visual-suite change; visual-gate auto-satisfied." >> "$GITHUB_STEP_SUMMARY"
          fi

  visual:
    name: visual suite (pinned Playwright container)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run suite
        env:
          VISUAL_KEEP_DIR: visual-actual
        run: bash scripts/ci/visual_in_container.sh ${{ inputs.update_baselines && 'update' || '' }}

      - name: Upload regenerated baselines
        # Also on failure: a PR run with missing baselines writes the actual shots there
        # (bootstrap before the workflow exists on main); download the artifact and commit it.
        if: ${{ always() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: visual-baselines
          path: tests/visual/__snapshots__/
          if-no-files-found: ignore

      - name: Upload actual images of failing screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: visual-actual
          path: visual-actual/
          if-no-files-found: ignore

  # ADR-0147 section 1: the handoff references are rendered here (same pinned
  # container as the app, overlay applied, never committed) and every surface is
  # compared. Advisory until a surface migrates (T-UR00b red run is expected with the
  # old app): continue-on-error, and `visual-gate` does not depend on it.
  reference:
    name: handoff reference comparison ${{ matrix.shard }} (advisory)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    # 1272 tests do not fit one 45 min job (run 45480373605): six shards of 212,
    # one per width x theme; each renders only its own references (T-UR00b).
    strategy:
      fail-fast: false
      matrix:
        shard: ["1440:light", "1440:dark", "1024:light", "1024:dark", "375:light", "375:dark"]
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Render references and compare every surface
        env:
          VISUAL_KEEP_DIR: visual-actual
          REFERENCE_SHARD: ${{ matrix.shard }}
          REFERENCE_SHARD_LABEL: ${{ matrix.shard }}
        run: bash scripts/ci/visual_in_container.sh reference

      - name: Name the shard for artifacts
        if: ${{ always() }}
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: echo "SHARD_NAME=${SHARD/:/-}" >> "$GITHUB_ENV"

      - name: Upload rendered references
        if: ${{ always() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: visual-references-${{ env.SHARD_NAME }}
          path: tests/visual/reference/
          if-no-files-found: ignore

      - name: Upload actual images and diffs of failing comparisons
        if: ${{ failure() }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: visual-reference-actual-${{ env.SHARD_NAME }}
          path: visual-actual/
          if-no-files-found: ignore

  # The single required status check. Success when the suite passed or was
  # legitimately skipped (irrelevant PR); failure when the suite failed.
  visual-gate:
    name: visual-gate
    needs: [changes, visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "changes=$CHANGES visual=$VISUAL"
          [ "$CHANGES" = "success" ] && { [ "$VISUAL" = "success" ] || [ "$VISUAL" = "skipped" ]; }
