# Manual early teardown of the drill environment (T-D90, ADR-0099 decision 3).
# Dispatch from any ref; it only ever targets env `drill`. Shares concurrency
# group `drill` with drill.yml, the sweeper and restore-drill.yml. Destroy runs in
# the ungated environment `drill-teardown` (terraform.yml picks it from
# `destroy: true`, ADR-0101), so it never waits for a reviewer.

name: drill-destroy

on:
  workflow_dispatch: {}

concurrency:
  group: drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    name: terraform destroy (drill)
    # T-D121: reusable callee requests these; less is a startup_failure.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform.yml
    with:
      env: drill
      destroy: true
    secrets: inherit  # pragma: allowlist secret

  # T-D124 (ADR-0101): destroying the VM leaves its tailnet node behind (offline);
  # a stale node makes the next drill register as budget-planner-drill-1 and the
  # certificate name no longer matches. Runs even when destroy failed (node may
  # exist); problems are warnings only.
  tailnet-cleanup:
    name: remove drill tailnet node
    needs: destroy
    if: ${{ always() && needs.destroy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drill-teardown # ungated; holds TS_CLEANUP_CLIENT_ID / TS_CLEANUP_SECRET
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/tailnet_drill_cleanup.py

      - name: Delete tag:drill nodes named budget-planner-drill[-n]
        env:
          TS_CLEANUP_CLIENT_ID: ${{ secrets.TS_CLEANUP_CLIENT_ID }}
          TS_CLEANUP_SECRET: ${{ secrets.TS_CLEANUP_SECRET }}
        run: python3 scripts/tailnet_drill_cleanup.py
