# Reusable: remove the drill's leftover tailnet nodes (T-D124, ADR-0101, T-D133).
#
# Destroying the VM leaves its tailnet node behind (offline); a stale node makes
# the next drill register as budget-planner-drill-1 and the certificate name no
# longer matches. Called by drill.yml, drill-destroy.yml, drill-sweeper.yml and
# restore-drill.yml after their destroy, with `if: always()` so it also runs
# when the destroy failed (the node may exist). Problems are warnings only.
#
# Runs in the ungated environment `drill-teardown`, which holds
# TS_CLEANUP_CLIENT_ID / TS_CLEANUP_SECRET (callers pass `secrets: inherit`).

name: tailnet-cleanup

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  cleanup:
    name: remove drill tailnet node
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drill-teardown # ungated; holds TS_CLEANUP_CLIENT_ID / TS_CLEANUP_SECRET
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/tailnet_drill_cleanup.py

      - name: Delete tag:drill nodes named budget-planner-drill[-n]
        env:
          TS_CLEANUP_CLIENT_ID: ${{ secrets.TS_CLEANUP_CLIENT_ID }}
          TS_CLEANUP_SECRET: ${{ secrets.TS_CLEANUP_SECRET }}
        run: python3 scripts/tailnet_drill_cleanup.py
