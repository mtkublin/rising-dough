name: Terraform

on:
  pull_request:
    branches: [main, v3]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt-validate:
    name: fmt + validate + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@acf4cf0ec6d41ca3cfe6cf15c53d99e3c7bb6d13 # v4.1.1
        with:
          tflint_version: v0.53.0

      - name: tflint --recursive
        run: tflint --recursive --init && tflint --recursive

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  plan:
    name: plan (${{ matrix.env }})
    needs: fmt-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: [drill, prod]
    defaults:
      run:
        working-directory: terraform

    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # T-D69 / ADR-0092: drill resources live in their own project.
      SCW_DEFAULT_PROJECT_ID: ${{ matrix.env == 'drill' && secrets.SCW_DRILL_PROJECT_ID || secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_scaleway_project_id: ${{ matrix.env == 'drill' && secrets.SCW_DRILL_PROJECT_ID || secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_scaleway_organization_id: ${{ secrets.SCW_DEFAULT_ORG_ID }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_domain: ${{ secrets.APP_DOMAIN }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
      TF_VAR_github_deploy_pubkey: ${{ secrets.GITHUB_DEPLOY_PUBKEY }}
      TF_VAR_ghcr_pull_pat: ${{ secrets.GHCR_PULL_PAT }}
      # T-D56 / ADR-0078 section 3: Litestream replica age encryption.
      TF_VAR_litestream_age_identity: ${{ secrets.LITESTREAM_AGE_IDENTITY }}
      TF_VAR_litestream_age_recipient: ${{ vars.LITESTREAM_AGE_RECIPIENT }}
      TF_VAR_env: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform init (${{ matrix.env }})
        run: terraform init -backend-config=envs/${{ matrix.env }}/backend.hcl -reconfigure

      - name: terraform plan (${{ matrix.env }})
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false -out=plan.bin | tee plan.out
          terraform show -no-color plan.bin > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            terraform/plan.bin
            terraform/plan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const envName = process.env.ENV_NAME;
            const planText = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = planText.length > 60000 ? planText.slice(0, 60000) + '\n... (truncated) ...' : planText;
            const body = [
              `### Terraform plan — \`${envName}\``,
              '',
              '```hcl',
              truncated,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `### Terraform plan — \`${envName}\``;
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply-prod:
    name: apply (prod)
    needs: fmt-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    defaults:
      run:
        working-directory: terraform

    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_scaleway_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_scaleway_organization_id: ${{ secrets.SCW_DEFAULT_ORG_ID }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_domain: ${{ secrets.APP_DOMAIN }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_operator_ssh_pubkey: ${{ secrets.OPERATOR_SSH_PUBKEY }}
      TF_VAR_github_deploy_pubkey: ${{ secrets.GITHUB_DEPLOY_PUBKEY }}
      TF_VAR_ghcr_pull_pat: ${{ secrets.GHCR_PULL_PAT }}
      # T-D56 / ADR-0078 section 3: Litestream replica age encryption.
      TF_VAR_litestream_age_identity: ${{ secrets.LITESTREAM_AGE_IDENTITY }}
      TF_VAR_litestream_age_recipient: ${{ vars.LITESTREAM_AGE_RECIPIENT }}
      TF_VAR_env: prod

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform init (prod)
        run: terraform init -backend-config=envs/prod/backend.hcl -reconfigure

      - name: terraform plan (prod)
        run: terraform plan -no-color -input=false -out=plan.bin

      - name: terraform apply (prod)
        run: terraform apply -no-color -input=false plan.bin
