name: Terraform

on:
  pull_request:
    branches: [main, v3]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  # ADR-0099: apply is reachable only via workflow_call (release.yml for prod;
  # the pre-merge drill validation workflow for drill). No push trigger.
  workflow_call:
    inputs:
      env:
        description: Target environment (drill | prod). prod requires ref main.
        type: string
        required: true
      image_ref:
        description: >-
          ADR-0111 - app image `<tag>@sha256:<digest>` the host should run. Empty
          keeps the ref recorded in state (or, with rollback, means the recorded
          previous ref). Ignored for destroy.
        type: string
        required: false
        default: ""
      rollback:
        description: ADR-0111 - roll back to image_ref, or to the previous ref recorded in state.
        type: boolean
        required: false
        default: false
      replace:
        description: Space-separated resource addresses for -replace (optional)
        type: string
        required: false
        default: ""
      destroy:
        description: Run a destroy plan/apply (-destroy)
        type: boolean
        required: false
        default: false
      drill_expires_at:
        description: Drill only (T-D90) - RFC3339 UTC expiry recorded as the server tag expires-at=<value> (read by the sweeper). Ignored for prod.
        type: string
        required: false
        default: ""
      boot_log_upload:
        description: Drill only (T-D90, ADR-0094) - upload boot diagnostics to the drill bucket. Ignored for prod.
        type: boolean
        required: false
        default: false
      reuse_drill_run_id:
        description: >-
          Drill only (T-D139, ADR-0116) - this apply targets an EXISTING drill VM (rollback): keep the
          drill_run_id recorded in state (or drill_run_id below) instead of this run's id. Fails if none.
          Creating runs (drill.yml, restore-drill.yml) leave it false. Ignored for prod.
        type: boolean
        required: false
        default: false
      drill_run_id:
        description: Drill only, with reuse_drill_run_id - digits-only override of the id recorded in state (operator repair). Ignored otherwise.
        type: string
        required: false
        default: ""
      drill_root_volume_type:
        description: Drill only (ADR-0127 §7, replace-rehearsal.yml) - l_ssd or sbs_volume. Prod is always l_ssd.
        type: string
        required: false
        default: l_ssd
      restore_source:
        description: >-
          Drill only (ADR-0132) - restore drill apply: run in the gated `prod-restore-read` environment and
          render the prod replica read key into the drill host. Only restore-drill.yml sets it; ignored for prod.
        type: boolean
        required: false
        default: false
      drill_allow_empty_db:
        description: Drill only (ADR-0127 §7, replace-rehearsal.yml) - "false" proves the restore guard refuses an empty replica. Ignored for prod.
        type: string
        required: false
        default: "true"
    outputs:
      host_config_generation:
        description: ADR-0111 - generation the host agent reports once converged (empty for destroy).
        value: ${{ jobs.apply.outputs.host_config_generation }}
      host_image_ref:
        description: ADR-0111 - full image ref (repo:tag@digest) the host should run (empty for destroy).
        value: ${{ jobs.apply.outputs.host_image_ref }}
      server_replaced:
        description: T-D156 / ADR-0127 - "true" when this apply replaced the app server (fresh host, restored DB).
        value: ${{ jobs.apply.outputs.server_replaced }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt-validate:
    name: fmt + validate + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ inputs.env != 'prod' && 1 || 0 }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: terraform init + validate (bootstrap stack, no backend)
        working-directory: terraform/bootstrap
        run: terraform init -backend=false && terraform validate

      # T-D77: offline render of the real user-data path (mock providers,
      # dummy values, no credentials) + cloud-init schema validation.
      - name: terraform test (mocked providers)
        run: terraform test

      - name: Install cloud-init
        run: |
          if ! command -v cloud-init >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cloud-init
          fi
          cloud-init --version

      - name: Render user-data + cloud-init schema
        run: python3 tests/render/render_check.py --require-schema

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.53.0

      - name: tflint --recursive
        run: tflint --recursive --init && tflint --recursive

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # T-D131: trivy 0.70.0 (action default) panics on sensitive() values
          # ("value is marked"); 0.76.2 scans the ADR-0111 user_data cleanly.
          version: v0.76.2
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  plan:
    name: plan (${{ matrix.env }})
    needs: fmt-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        env: [drill, prod]
    # ADR-0093 / ADR-0101: `prod` and `drill` have required reviewers, which
    # would gate every PR plan. Both legs read ungated plan environments
    # (`prod-plan`, `drill-plan`: same secret names, per-env values) instead.
    environment: ${{ matrix.env == 'prod' && 'prod-plan' || 'drill-plan' }}
    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      # T-D70 / ADR-0093 / T-D133: the TF_VAR_* inputs are exported by the
      # terraform-env action (mapping in scripts/ci/tf_env.py).
      # ADR-0111: placeholder; Terraform steps set it from the "Resolve image
      # refs" step outputs as step-level env.
      TF_VAR_app_image_ref: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Terraform inputs (TF_VAR_*, T-D133)
        uses: ./.github/actions/terraform-env
        with:
          env: ${{ matrix.env }}
          # T-Q309 / ADR-0132: prod-plan holds no Tailscale OAuth client.
          plan-only: ${{ matrix.env == 'prod' }}
          secrets-json: ${{ toJSON(secrets) }}
          vars-json: ${{ toJSON(vars) }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Mask secret inputs (T-D83)
        run: |
          # GitHub secrets are masked already; this also covers each line of
          # multi-line values. Secrets minted inside Terraform (Tailscale key,
          # IAM keys) are only caught by scripts/mask_plan.py patterns.
          for v in TF_VAR_ghcr_pull_pat TF_VAR_litestream_age_identity TF_VAR_tailscale_oauth_client_secret TF_VAR_app_scw_secret_key SCW_SECRET_KEY; do
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "${!v:-}"
          done

      - name: terraform init (${{ matrix.env }})
        run: terraform init -input=false -backend-config=envs/${{ matrix.env }}/backend.hcl -reconfigure

      # ADR-0111: a PR plan keeps the image ref recorded in state; never applied,
      # so an empty state (drill after teardown) may use a placeholder. Steps
      # that need the refs get them as step-level env (wins over job env).
      - name: Resolve image refs
        id: refs
        run: |
          set -euo pipefail
          current="$(terraform output -raw app_image_ref 2>/dev/null || true)"
          previous="$(terraform output -raw app_image_previous_ref 2>/dev/null || true)"
          python3 ../scripts/ci/host_release.py refs --current "${current}" --current-previous "${previous}" --plan-only | tee -a "$GITHUB_OUTPUT"

      - name: Check required Terraform inputs
        env:
          TF_VAR_app_image_ref: ${{ steps.refs.outputs.ref }}
          TF_VAR_app_image_previous_ref: ${{ steps.refs.outputs.previous }}
        run: python3 scripts/check_tf_vars.py

      - name: terraform plan (${{ matrix.env }})
        id: plan
        env:
          TF_VAR_app_image_ref: ${{ steps.refs.outputs.ref }}
          TF_VAR_app_image_previous_ref: ${{ steps.refs.outputs.previous }}
        run: |
          # T-D83 / ADR-0098: never print raw plan output (cloud_init embeds
          # secrets and Terraform may show the prior state value unmasked).
          set -o pipefail
          # T-Q309 / ADR-0132 amendment: prod-plan holds no Tailscale OAuth client,
          # so the prod plan cannot refresh tailscale_tailnet_key; it plans from
          # state (-refresh=false). Apply always refreshes. Drill refreshes.
          refresh=true
          if [ "${{ matrix.env }}" = "prod" ]; then refresh=false; fi
          terraform plan -no-color -input=false -lock=false -refresh="${refresh}" -out=plan.bin | python3 scripts/mask_plan.py | tee plan.out
          terraform show -no-color plan.bin | python3 scripts/mask_plan.py > plan.txt

      # T-D158: the masked text plan can hide the server diff, so the PR plan
      # also says whether the app server would be replaced (JSON, no secrets
      # printed: only `replaced=` and the server id).
      - name: Detect VM replacement (plan)
        run: |
          set -euo pipefail
          terraform show -json plan.bin | python3 ../scripts/ci/host_release.py replaced | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tfplan-${{ matrix.env }}
          # plan.bin is not uploaded: the binary plan embeds raw config and
          # state values, including the rendered user-data (T-D83).
          path: terraform/plan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const envName = process.env.ENV_NAME;
            const planText = fs.readFileSync('terraform/plan.txt', 'utf8');
            const truncated = planText.length > 60000 ? planText.slice(0, 60000) + '\n... (truncated) ...' : planText;
            const body = [
              `### Terraform plan — \`${envName}\``,
              '',
              '```hcl',
              truncated,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `### Terraform plan — \`${envName}\``;
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: apply (${{ inputs.env }})
    needs: fmt-validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # T-D156: plan + apply + up to 1800 s host wait when the VM is replaced;
    # T-D157: plus up to 300 s for the drain.
    timeout-minutes: 55
    # ADR-0099 / ADR-0101: `prod` and `drill` have required reviewers (approval
    # gate before apply). A drill destroy must never wait for approval (sweeper
    # cron, drill-destroy, end-of-pipeline teardown), so it runs in the ungated
    # `drill-teardown` environment, which holds the same drill secrets/vars.
    # Prod destroy keeps the gated `prod` environment. ADR-0132: the restore
    # drill apply (restore_source) runs in the gated, main-only `prod-restore-read`
    # environment, the only place the prod replica read key and prod age identity live.
    environment:
      name: ${{ (inputs.restore_source && !inputs.destroy) && 'prod-restore-read' || (inputs.destroy && inputs.env == 'drill') && 'drill-teardown' || inputs.env }}
    defaults:
      run:
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      # T-D70 / ADR-0093 / T-D133: the TF_VAR_* inputs are exported by the
      # terraform-env action (mapping in scripts/ci/tf_env.py).
      TARGET_ENV: ${{ inputs.env }}
      IMAGE_REF: ${{ inputs.image_ref }}
      TF_ROLLBACK: ${{ inputs.rollback }}
      # ADR-0111: placeholder; Terraform steps set it from the "Resolve image
      # refs" step outputs as step-level env.
      TF_VAR_app_image_ref: ""
      TF_REPLACE: ${{ inputs.replace }}
      TF_DESTROY: ${{ inputs.destroy }}
      DRILL_RUN_ID_OVERRIDE: ${{ inputs.env == 'drill' && inputs.drill_run_id || '' }}
      # T-D90: drill-only knobs, forced to their prod-safe values otherwise.
      TF_VAR_drill_expires_at: ${{ inputs.env == 'drill' && inputs.drill_expires_at || '' }}
      TF_VAR_boot_log_upload: ${{ inputs.env == 'drill' && inputs.boot_log_upload || false }}
      # ADR-0127 §7: rehearsal knobs, forced to their defaults otherwise (prod ignores them).
      TF_VAR_drill_root_volume_type: ${{ inputs.env == 'drill' && inputs.drill_root_volume_type || 'l_ssd' }}
      TF_VAR_drill_allow_empty_db: ${{ inputs.env == 'drill' && inputs.drill_allow_empty_db || 'true' }}

    outputs:
      host_config_generation: ${{ steps.host.outputs.generation }}
      host_image_ref: ${{ steps.host.outputs.image_ref }}
      server_replaced: ${{ steps.replace.outputs.replaced }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # T-D134: the prod ref guard tests "tag commit is on main"; that needs history.
          fetch-depth: ${{ inputs.env != 'prod' && 1 || 0 }}

      - name: Terraform inputs (TF_VAR_*, T-D133)
        uses: ./.github/actions/terraform-env
        with:
          env: ${{ inputs.env }}
          restore-source: ${{ inputs.restore_source && !inputs.destroy && inputs.env == 'drill' }}
          secrets-json: ${{ toJSON(secrets) }}
          vars-json: ${{ toJSON(vars) }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # T-D134: the drill runs the same guard as prod (this job's working
      # directory is terraform/, hence ../scripts). A refusal (exit 1) is only a
      # notice on the drill, which may deploy any branch; any other failure
      # (missing script, crash) fails the drill too, so the prod path is tested.
      - name: Guard env / ref (ADR-0099, ADR-0109)
        run: |
          set -euo pipefail
          case "${TARGET_ENV}" in
            drill)
              rc=0
              python3 ../scripts/ci/ref_guard.py ref --ref "${GITHUB_REF}" || rc=$?
              if [ "${rc}" -gt 1 ]; then exit "${rc}"; fi
              if [ "${rc}" -eq 1 ]; then
                echo "::notice::drill from ${GITHUB_REF}: prod would refuse this ref (allowed on drill)"
              fi
              ;;
            prod)
              python3 ../scripts/ci/ref_guard.py ref --ref "${GITHUB_REF}" ;;
            *) echo "::error::env must be drill or prod" >&2; exit 1 ;;
          esac

      - name: Mask secret inputs (T-D83)
        run: |
          # GitHub secrets are masked already; this also covers each line of
          # multi-line values. Secrets minted inside Terraform (Tailscale key,
          # IAM keys) are only caught by scripts/mask_plan.py patterns.
          for v in TF_VAR_ghcr_pull_pat TF_VAR_litestream_age_identity TF_VAR_tailscale_oauth_client_secret TF_VAR_app_scw_secret_key SCW_SECRET_KEY; do
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "${!v:-}"
          done

      - name: terraform init (${{ inputs.env }})
        run: terraform init -input=false -backend-config=envs/${{ inputs.env }}/backend.hcl -reconfigure

      # T-D139 / ADR-0116: an apply on an existing drill keeps its run id (the
      # host name is built from it). Overrides the TF_VAR_ the action exported;
      # fails rather than minting a new id.
      - name: Reuse the drill run id (existing drill)
        if: ${{ inputs.env == 'drill' && inputs.reuse_drill_run_id }}
        run: |
          set -euo pipefail
          state_id="$(terraform output -raw drill_run_id 2>/dev/null || true)"
          id="$(python3 ../scripts/ci/drill_run_id.py --override "${DRILL_RUN_ID_OVERRIDE}" --state "${state_id}")"
          echo "TF_VAR_drill_run_id=${id}" >> "$GITHUB_ENV"
          echo "drill run id: ${id} (state: ${state_id:-none}, override: ${DRILL_RUN_ID_OVERRIDE:-none})"

      # ADR-0111: the current ref (from state) becomes the previous ref; a
      # rollback swaps them. Refs are <tag>@sha256:<digest> (validated).
      - name: Resolve image refs
        id: refs
        run: |
          set -euo pipefail
          current="$(terraform output -raw app_image_ref 2>/dev/null || true)"
          previous="$(terraform output -raw app_image_previous_ref 2>/dev/null || true)"
          flags=()
          if [ "${TF_DESTROY}" = "true" ]; then flags+=(--destroy); fi
          if [ "${TF_ROLLBACK}" = "true" ]; then flags+=(--rollback); fi
          python3 ../scripts/ci/host_release.py refs --new "${IMAGE_REF}" --current "${current}" --current-previous "${previous}" "${flags[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Check required Terraform inputs
        env:
          TF_VAR_app_image_ref: ${{ steps.refs.outputs.ref }}
          TF_VAR_app_image_previous_ref: ${{ steps.refs.outputs.previous }}
        run: python3 scripts/check_tf_vars.py

      # T-D83 / ADR-0098: plan output is always piped through mask_plan.py and
      # plan.bin is never uploaded (it embeds raw config/state values).
      - name: terraform plan (${{ inputs.env }})
        env:
          TF_VAR_app_image_ref: ${{ steps.refs.outputs.ref }}
          TF_VAR_app_image_previous_ref: ${{ steps.refs.outputs.previous }}
        run: |
          set -euo pipefail
          args=(-no-color -out=plan.bin)
          if [ "${TF_DESTROY}" = "true" ]; then args+=(-destroy); fi
          for addr in ${TF_REPLACE}; do args+=("-replace=${addr}"); done
          terraform plan -input=false "${args[@]}" | python3 scripts/mask_plan.py

      # T-D156 / ADR-0127: a replaced server is a fresh host that restores the
      # database. The plan JSON holds secrets: it goes straight into the script,
      # which prints only `replaced=true|false`.
      - name: Detect VM replacement
        id: replace
        run: |
          set -euo pipefail
          terraform show -json plan.bin | python3 ../scripts/ci/host_release.py replaced | tee -a "$GITHUB_OUTPUT"

      # T-D157 / ADR-0127 amendment: drain the old host before it is destroyed,
      # so no committed write is lost. The drill's status is tailnet-only.
      - name: Join the tailnet for the drill drain (tag:ci)
        if: ${{ steps.replace.outputs.replaced == 'true' && inputs.env == 'drill' }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Sets the transient `bp-drain` key on the current server (Scaleway API,
      # this job's credentials) and waits for the agent to report `drained`.
      - name: Drain the old host (VM replacement)
        id: drain
        if: ${{ steps.replace.outputs.replaced == 'true' }}
        env:
          SERVER_ID: ${{ steps.replace.outputs.server_id }}
          DRAIN_REQUEST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          url="https://$(terraform output -raw fqdn)/.well-known/bp-deploy-status.json"
          # T-D158 / ADR-0127 amendment 2: an agent that cannot drain fails here,
          # before the key is set and before the apply.
          python3 ../scripts/ci/host_release.py drain-capable --url "${url}"
          python3 ../scripts/ci/scw_user_data.py set --server "${SERVER_ID}" --value "${DRAIN_REQUEST}"
          python3 ../scripts/ci/host_release.py wait-drained --url "${url}" --request "${DRAIN_REQUEST}"

      - name: terraform apply (${{ inputs.env }})
        id: apply
        run: |
          set -o pipefail
          terraform apply -no-color -input=false plan.bin | python3 scripts/mask_plan.py

      # T-D157: a failed drain, or an apply that failed while the old server
      # still exists, must not leave the old host drained (DELETE; 404 = gone).
      # cancelled(): an operator cancel or the job timeout must undrain too.
      - name: Undrain the old host (drain or apply failed)
        if: ${{ (failure() || cancelled()) && (steps.drain.outcome == 'success' || steps.drain.outcome == 'failure' || steps.drain.outcome == 'cancelled') && steps.apply.outcome != 'success' }}
        env:
          SERVER_ID: ${{ steps.replace.outputs.server_id }}
        run: python3 ../scripts/ci/scw_user_data.py delete --server "${SERVER_ID}"

      - name: Record host state outputs (ADR-0111)
        id: host
        if: ${{ !inputs.destroy }}
        run: |
          set -euo pipefail
          {
            echo "generation=$(terraform output -raw host_config_generation)"
            echo "image_ref=$(terraform output -raw host_image_ref)"
            echo "url=https://$(terraform output -raw fqdn)/.well-known/bp-deploy-status.json"
          } | tee -a "$GITHUB_OUTPUT"

      # ADR-0111: the release is done when the host agent reports this
      # generation applied. Prod only: the drill is tailnet-only, so drill.yml
      # checks the status from its tailnet-connected smoke job.
      - name: Wait for host convergence (prod)
        id: converge
        if: ${{ !inputs.destroy && inputs.env == 'prod' }}
        env:
          STATUS_URL: ${{ steps.host.outputs.url }}
          GENERATION: ${{ steps.host.outputs.generation }}
          HOST_IMAGE_REF: ${{ steps.host.outputs.image_ref }}
          SERVER_REPLACED: ${{ steps.replace.outputs.replaced }}
        run: |
          set -euo pipefail
          # T-D156 / ADR-0127: a fresh host boots, installs Docker and restores
          # the database; it must report restore.result == "restored".
          args=()
          if [ "${SERVER_REPLACED}" = "true" ]; then args+=(--timeout 1800 --require-restore); fi
          python3 ../scripts/ci/host_release.py wait --url "${STATUS_URL}" --generation "${GENERATION}" --ref "${HOST_IMAGE_REF}" "${args[@]}"

      # ADR-0111: automatic rollback inside the already approved job: re-apply
      # with the refs swapped, wait for the host, and keep the job failed.
      - name: Roll back to the previous ref (prod)
        if: ${{ failure() && steps.converge.outcome == 'failure' && steps.refs.outputs.previous != '' && steps.replace.outputs.replaced != 'true' }}
        env:
          STATUS_URL: ${{ steps.host.outputs.url }}
          # Swapped: the previous ref runs again, the failed one is recorded as previous.
          TF_VAR_app_image_ref: ${{ steps.refs.outputs.previous }}
          TF_VAR_app_image_previous_ref: ${{ steps.refs.outputs.ref }}
        run: |
          set -euo pipefail
          echo "::warning::host did not converge on ${TF_VAR_app_image_previous_ref}; rolling back to ${TF_VAR_app_image_ref}"
          terraform plan -no-color -input=false -out=rollback.bin | python3 scripts/mask_plan.py
          terraform apply -no-color -input=false rollback.bin | python3 scripts/mask_plan.py
          python3 ../scripts/ci/host_release.py wait --url "${STATUS_URL}" \
            --generation "$(terraform output -raw host_config_generation)" \
            --ref "$(terraform output -raw host_image_ref)"
          echo "::error::release rolled back to ${TF_VAR_app_image_ref}"
          exit 1

      # T-D156 / ADR-0127: swapping the image cannot fix a failed first boot or
      # restore on a replaced VM; no automatic rollback.
      - name: Replaced VM did not converge (prod)
        if: ${{ failure() && steps.converge.outcome == 'failure' && steps.replace.outputs.replaced == 'true' }}
        run: |
          echo "::error::the replaced prod VM did not converge or did not restore the database; no automatic rollback. Follow docs/plans/v3/runbooks/disaster-recovery.md and deploy.md (Releases that replace the VM)."
          exit 1
