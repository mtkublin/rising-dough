<!-- @dsCard height=320 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: var(--color-ground); }
  .cover { width: 960px; height: 320px; box-sizing: border-box; padding: 0; position: relative; }
  .band { display: block; }
  .slab { rx: var(--radius-lg); }
  .bake { fill: var(--color-bake); }
  .deep { fill: var(--color-ink); }
  .nowfill { fill: var(--color-now-fill); }
  .now { fill: var(--color-now-fill); stroke: var(--color-now-edge); stroke-width: 1; }
  .past { fill: var(--color-past); }
  .over { fill: var(--color-over); }
  .text { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 880px; }
  .name { margin: 0; font-family: var(--font-display, "Unbounded", sans-serif); font-weight: 700; font-size: 64px;
           line-height: 0.95; letter-spacing: -0.04em; color: var(--color-ink); }
  .tag { margin: var(--space-3) 0 0; font-family: var(--font-mono, "Geist Mono", monospace); font-size: 13px;
          color: var(--color-ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
    <!-- blocks: color-bake 448x112 (radius-lg), color-ink 208x112 (ink-deep vanished on the dark ground), color-now-fill 144x112, color-past 96x56, color-over 48x48 (pill)
         arrangement: one strip of unequal bands across the top, flush, gaps of space-4
         pattern: a row of loaves (radius-pill tops) on the bake field; the README: "Charts are rows of loaves, the current one is now-fill"
         scales: space-4 gaps, space-12 loaf pitch, radius-lg slabs, radius-pill loaves -->
    <rect class="bake slab" x="0" y="0" width="448" height="112"/>
    <rect class="past" x="24" y="56" width="32" height="44" rx="16"/>
    <rect class="past" x="72" y="42" width="32" height="58" rx="16"/>
    <rect class="past" x="120" y="50" width="32" height="50" rx="16"/>
    <rect class="past" x="168" y="34" width="32" height="66" rx="16"/>
    <rect class="past" x="216" y="46" width="32" height="54" rx="16"/>
    <rect class="past" x="264" y="28" width="32" height="72" rx="16"/>
    <rect class="past" x="312" y="38" width="32" height="62" rx="16"/>
    <rect class="now" x="360" y="20" width="32" height="80" rx="16"/>
    <rect class="deep slab" x="464" y="0" width="208" height="112"/>
    <rect class="nowfill slab" x="688" y="0" width="144" height="112"/>
    <rect class="past slab" x="848" y="0" width="112" height="56"/>
    <rect class="over" x="848" y="64" width="48" height="48" rx="24"/>
  </svg>
  <div class="text">
    <h1 class="name">Rising Dough —<br>Sourdough</h1>
    <p class="tag">A budget planner that leads with the number. Light and dark, one set of tokens.</p>
  </div>
</div>
</body>
</html>
