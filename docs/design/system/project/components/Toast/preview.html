<!-- @dsCard group="Feedback" height=240 width=480 subtitle="toast · menu · flash" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body class="rd-app rd-app--bare">
<svg class="rd-sprite" aria-hidden="true" focusable="false">
  
  <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-passkey" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6 1.2 0 2.3.3 3.2.9M17 12a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zm0 5v4m0-2h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
</svg>
<section class="rd-card rd-comp-card" aria-label="toast · menu · flash"><h2 class="rd-caption rd-caption--upper">toast · menu · flash</h2><div class="rd-toast" role="status"><span>Takeaway · −35.50 PLN deleted</span><button type="button" class="rd-toast__action">undo</button></div>
<div class="rd-menu rd-menu--static" role="menu" aria-label="Example menu"><button type="button" class="rd-menu__item" role="menuitem">edit</button><button type="button" class="rd-menu__item rd-menu__item--danger" role="menuitem">delete</button></div>
<!-- fragment: flash/success -->
<div class="rd-flash rd-flash--success" role="status"><span>● Saved · Takeaway −35.50 PLN</span><button type="button" class="rd-btn rd-btn--icon rd-flash__close" aria-label="Dismiss" data-js="flash-close"><svg class="rd-icon" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg></button></div>
<!-- /fragment --><!-- fragment: flash/error -->
<div class="rd-flash rd-flash--error" role="alert"><span>▲ Couldn’t save. Your changes are still in the form.</span><button type="button" class="rd-btn rd-btn--icon rd-flash__close" aria-label="Dismiss" data-js="flash-close"><svg class="rd-icon" aria-hidden="true" focusable="false"><use href="#icon-close"></use></svg></button></div>
<!-- /fragment --></section>
</body>
</html>
